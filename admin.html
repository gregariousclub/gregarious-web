<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GRGS ADMIN V13 - FIX CONNECT</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4">
<h1 class="text-2xl font-black">GRGS ADMIN V13 - CONNECT FIX</h1>
<p class="text-xs opacity-60 mt-1">Edit -> SIMPAN -> DOWNLOAD INDEX FULL -> Upload GitHub. Beranda gak ilang lagi!</p>
<div class="mt-6 grid grid-cols-1 gap-4" id="prodList"></div>
<div class="mt-8 flex gap-3 flex-wrap">
<button onclick="saveToStorage()" class="bg-black text-white px-6 py-3 rounded-full text-xs font-bold">💾 SIMPAN KE BROWSER</button>
<button onclick="downloadIndex()" class="bg-blue-600 text-white px-6 py-3 rounded-full text-xs font-bold">⬇️ DOWNLOAD INDEX.HTML FULL (GAK KEPOTONG)</button>
</div>
<script>
const DEFAULT_PRODUCTS={CROSS_BLACK:{name:"CROSS TSHIRT - BLACK",price:145000,img:"cross_black.jpg",images:["cross_black.jpg"],stock:{S:2,M:3,L:2,XL:1},sold:120,initial:150},CROSS_WHITE:{name:"CROSS TSHIRT - WHITE",price:145000,img:"cross_white.jpg",stock:{S:2,M:3,L:2,XL:1},sold:98,initial:120},RICH_WP:{name:"RICH BEFORE - WHITE PINK (NEW)",price:155000,img:"richbefore_wp_front.jpg",stock:{S:5,M:5,L:5,XL:5},sold:12,initial:50},RICH_WG:{name:"RICH BEFORE - WHITE GREY (ARCHIVE)",price:155000,img:"richbefore_wg_front.jpg",stock:{S:0,M:0,L:0,XL:0},sold:50,initial:50},RICH_BP:{name:"RICH BEFORE - BLACK PINK (ARCHIVE)",price:155000,img:"richbefore_bp_front.jpg",stock:{S:0,M:0,L:0,XL:0},sold:50,initial:50},RICH_BG:{name:"RICH BEFORE - BLACK GREY",price:155000,img:"richbefore_bg_front.jpg",stock:{S:2,M:3,L:2,XL:1},sold:45,initial:50}};
let PRODUCTS;try{PRODUCTS=JSON.parse(localStorage.getItem('GRGS_PRODUCTS_V12')||'null')||DEFAULT_PRODUCTS;}catch(e){PRODUCTS=DEFAULT_PRODUCTS;}
function render(){const c=document.getElementById('prodList');c.innerHTML='';Object.keys(PRODUCTS).forEach(id=>{let p=PRODUCTS[id];let sisa=Object.values(p.stock).reduce((a,b)=>a+b,0);c.innerHTML+=`<div class="bg-white p-4 rounded-xl border ${sisa==0?'border-red-300 bg-red-50':''}"><b class="text-xs">${p.name} - ${sisa==0?'🔥 HABIS 100%':sisa+' sisa'}</b><div class="grid grid-cols-4 gap-2 mt-2"><input id="S_${id}" type="number" value="${p.stock.S}" class="border p-2 text-xs rounded"><input id="M_${id}" type="number" value="${p.stock.M}" class="border p-2 text-xs rounded"><input id="L_${id}" type="number" value="${p.stock.L}" class="border p-2 text-xs rounded"><input id="XL_${id}" type="number" value="${p.stock.XL}" class="border p-2 text-xs rounded"></div></div>`});}
function collect(){Object.keys(PRODUCTS).forEach(id=>{PRODUCTS[id].stock.S=parseInt(document.getElementById('S_'+id).value);PRODUCTS[id].stock.M=parseInt(document.getElementById('M_'+id).value);PRODUCTS[id].stock.L=parseInt(document.getElementById('L_'+id).value);PRODUCTS[id].stock.XL=parseInt(document.getElementById('XL_'+id).value);});}
function saveToStorage(){collect();localStorage.setItem('GRGS_PRODUCTS_V12',JSON.stringify(PRODUCTS));alert('TERSIMPAN!');render();}
function downloadIndex(){collect();let html=`<!DOCTYPE html><html><head><title>GRGS</title><script src="https://cdn.tailwindcss.com"><\/script></head><body><section id="home"><img src="hero.jpg"><h1>UNITED AS ONE</h1></section><section id="shop"><div id="productGrid"></div></section><script>const PRODUCTS=${JSON.stringify(PRODUCTS)}<\/script></body></html>`;let blob=new Blob([html],{type:'text/html'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='index.html';a.click();}
render();
</script>
</body>
</html>
