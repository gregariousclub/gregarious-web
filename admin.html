<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GRGS ADMIN V2 - FIX</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#f5f5f5] p-3 md:p-6">
<div class="max-w-[800px] mx-auto">
<div class="bg-black text-white p-5 rounded-[16px] flex justify-between items-center">
<div><h1 class="font-black text-[18px]">GRGS ADMIN PANEL V2</h1><p class="text-[10px] opacity-60">FIX - PRODUK PASTI MUNCUL</p></div>
<a href="/" class="bg-white text-black px-4 py-2 rounded-full text-[11px] font-bold">LIHAT TOKO</a>
</div>

<div class="bg-white p-5 rounded-[16px] border mt-4">
<h3 class="font-black text-[12px] mb-3">⚙️ SETTING TOKO</h3>
<label class="text-[10px] font-bold">NOMOR WA ADMIN</label>
<input id="wa" value="62881023595180" class="w-full border rounded-full px-4 py-2.5 text-[13px] mb-3">
<label class="text-[10px] font-bold">RUNNING TEXT JALAN</label>
<input id="running" value="FREE STICKER PACK SETIAP PEMBELIAN • BANDUNG 40614 • ORDER SEBELUM 15:00 KIRIM HARI SAMA • NEW DROP BABYTEE RHINESTONE 135K" class="w-full border rounded-full px-4 py-2.5 text-[11px] mb-3">
<label class="text-[10px] font-bold">NO REK BRI</label>
<input id="rek" value="074901024253504" class="w-full border rounded-full px-4 py-2.5 text-[13px] mb-3">
</div>

<div class="bg-white p-5 rounded-[16px] border mt-4">
<div class="flex justify-between items-center mb-4">
<h3 class="font-black text-[12px]">👕 PRODUK - 4 PRODUK</h3>
<button onclick="addProduct()" class="bg-black text-white px-4 py-2 rounded-full text-[10px] font-bold">+ TAMBAH PRODUK</button>
</div>
<div id="productList"></div>
</div>

<div class="bg-white p-5 rounded-[16px] border mt-4">
<h3 class="font-black text-[12px] mb-3">🚚 ONGKIR</h3>
<div id="ongkirList"></div>
<button onclick="addOngkir()" class="w-full border border-dashed py-3 rounded-full text-[11px] font-bold mt-3">+ TAMBAH ONGKIR</button>
</div>

<div class="bg-black text-white p-5 rounded-[16px] mt-4">
<h3 class="font-black text-[12px]">💾 SIMPAN & UPDATE</h3>
<button onclick="downloadNewIndex()" class="w-full bg-white text-black py-4 rounded-full font-black text-[12px] mt-4">⬇️ DOWNLOAD INDEX.HTML BARU</button>
<p id="status" class="text-[11px] mt-3 text-center opacity-70"></p>
<textarea id="outputCode" class="w-full h-[150px] bg-[#111] text-green-400 p-3 text-[9px] font-mono mt-3 rounded-[12px] hidden"></textarea>
</div>
</div>

<script>
let products = [
  {id:"CROSS_BLACK", name:"CROSS TSHIRT - BLACK", price:145000, img:"cross_black.jpg", stock:{S:0,M:0,L:2,XL:0}},
  {id:"CROSS_WHITE", name:"CROSS TSHIRT - WHITE", price:145000, img:"cross_white.jpg", stock:{S:0,M:3,L:2,XL:1}},
  {id:"BABY_BLACK", name:"BABYTEE RHINESTONE - BLACK", price:135000, img:"babytee_black.jpg", stock:{S:5,M:5,L:5,XL:0}},
  {id:"BABY_WHITE", name:"BABYTEE RHINESTONE - WHITE", price:135000, img:"babytee_white.jpg", stock:{S:5,M:5,L:5,XL:0}}
];
let ongkir = {"JNE Reguler":15000,"JNE YES":30000,"J&T REG":14000,"J&T ECO":11000};

function render(){
  let pl=document.getElementById('productList');
  pl.innerHTML='';
  products.forEach((p, idx)=>{
    let div=document.createElement('div');
    div.className='border rounded-[12px] p-3 mb-3 bg-[#fafafa]';
    div.innerHTML=`
      <div class="flex justify-between items-center">
        <input id="pid_${idx}" value="${p.id}" class="font-mono text-[10px] font-bold bg-white border px-2 py-1 rounded w-[120px]">
        <button onclick="products.splice(${idx},1);render()" class="text-red-500 text-[10px] font-bold">HAPUS</button>
      </div>
      <input id="pname_${idx}" value="${p.name}" class="w-full border rounded-full px-3 py-2 mt-2 text-[12px] font-bold">
      <div class="grid grid-cols-2 gap-2 mt-2">
        <input id="pprice_${idx}" type="number" value="${p.price}" class="border rounded-full px-3 py-2 text-[12px] font-bold">
        <input id="pimg_${idx}" value="${p.img}" class="border rounded-full px-3 py-2 text-[11px]">
      </div>
      <div class="grid grid-cols-4 gap-2 mt-2">
        <div><label class="text-[9px]">S</label><input id="ps_${idx}" type="number" value="${p.stock.S||0}" class="w-full border rounded-full py-2 text-center text-[12px] font-bold"></div>
        <div><label class="text-[9px]">M</label><input id="pm_${idx}" type="number" value="${p.stock.M||0}" class="w-full border rounded-full py-2 text-center text-[12px] font-bold"></div>
        <div><label class="text-[9px]">L</label><input id="pl_${idx}" type="number" value="${p.stock.L||0}" class="w-full border rounded-full py-2 text-center text-[12px] font-bold"></div>
        <div><label class="text-[9px]">XL</label><input id="pxl_${idx}" type="number" value="${p.stock.XL||0}" class="w-full border rounded-full py-2 text-center text-[12px] font-bold"></div>
      </div>
      <button onclick="saveProduct(${idx})" class="w-full bg-black text-white py-2 rounded-full text-[10px] font-bold mt-2">💾 SAVE PRODUK INI</button>
    `;
    pl.appendChild(div);
  });

  let ol=document.getElementById('ongkirList');
  ol.innerHTML='';
  Object.keys(ongkir).forEach(k=>{
    let div=document.createElement('div');
    div.className='flex gap-2 mb-2';
    div.innerHTML=`<input value="${k}" class="flex-1 border rounded-full px-3 py-2 text-[11px]"><input type="number" value="${ongkir[k]}" class="w-[100px] border rounded-full px-3 py-2 text-[11px] font-bold"><button onclick="delete ongkir['${k}'];render()" class="text-red-500 font-bold text-[12px]">✕</button>`;
    ol.appendChild(div);
  });
}

function saveProduct(i){
  products[i].id=document.getElementById('pid_'+i).value;
  products[i].name=document.getElementById('pname_'+i).value;
  products[i].price=parseInt(document.getElementById('pprice_'+i).value);
  products[i].img=document.getElementById('pimg_'+i).value;
  products[i].stock.S=parseInt(document.getElementById('ps_'+i).value);
  products[i].stock.M=parseInt(document.getElementById('pm_'+i).value);
  products[i].stock.L=parseInt(document.getElementById('pl_'+i).value);
  products[i].stock.XL=parseInt(document.getElementById('pxl_'+i).value);
  document.getElementById('status').innerText='✅ Produk '+products[i].name+' di-save!';
}

function addProduct(){
  products.push({id:"BARU_"+Date.now(), name:"PRODUK BARU", price:135000, img:"foto_baru.jpg", stock:{S:5,M:5,L:5,XL:0}});
  render();
}
function addOngkir(){
  ongkir["Kurir Baru"]=15000;
  render();
}

function downloadNewIndex(){
  products.forEach((p,i)=>{
    let el=document.getElementById('pid_'+i);
    if(el){ saveProduct(i); }
  });
  let wa=document.getElementById('wa').value;
  let rek=document.getElementById('rek').value;
  let running=document.getElementById('running').value;

  let productsObj={};
  products.forEach(p=>{ productsObj[p.id]={name:p.name, price:p.price, img:p.img, stock:p.stock} });

  let html = `<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GREGARIOUS CLUB</title><script src="https://cdn.tailwindcss.com"><\/script><link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@700;900&family=Bebas+Neue&display=swap" rel="stylesheet"><style>.serif{font-family:'Instrument Serif',serif}.bebas{font-family:'Bebas Neue',sans-serif}.grgs{font-family:'Inter',sans-serif;font-weight:900}.logo-oval{border:2.5px solid currentColor;border-radius:50%;padding:7px 24px;display:inline-block}.marquee{animation:marquee 20s linear infinite;display:inline-flex;white-space:nowrap}@keyframes marquee{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}<\/style></head><body class="bg-white text-black">
<script>const NO_WA="${wa}",REK_BRI="${rek}",NAMA_REK="RIZAL FARUK HAYDAR";const PRODUCTS=${JSON.stringify(productsObj)};const ONGKIR=${JSON.stringify(ongkir)};<\/script>
<div class="bg-black text-white py-2.5 overflow-hidden whitespace-nowrap"><div class="marquee text-[11px] tracking-[0.25em] font-bold"><span class="mx-10">✦ ${running} ✦ </span><span class="mx-10">✦ ${running} ✦ </span><span class="mx-10">✦ ${running} ✦ </span></div></div>
<header class="sticky top-0 z-40 bg-white/95 backdrop-blur border-b flex justify-between items-center px-6 py-4"><button onclick="document.getElementById('menu').classList.remove('hidden')">☰</button><div class="logo-oval grgs">GRGS</div><button onclick="document.getElementById('cart').classList.remove('hidden')" class="border border-black px-5 py-2 rounded-full text-[11px] font-bold">CART <span id="cartCount">0</span></button></header>
<div id="menu" class="fixed inset-0 z-[100] hidden"><div class="absolute inset-0 bg-black/60" onclick="this.parentElement.classList.add('hidden')"></div><div class="absolute left-0 top-0 h-full w-[85%] bg-white p-8"><button onclick="document.getElementById('menu').classList.add('hidden')" class="mb-8 font-bold text-[11px]">✕ CLOSE</button><a href="#home" class="block bebas text-[36px] border-b py-3">BERANDA</a><a href="#shop" class="block bebas text-[36px] border-b py-3">SHOP</a></div></div>
<section id="home" class="relative h-[88vh] bg-black text-white flex items-center justify-center text-center overflow-hidden"><img src="hero.jpg" onerror="this.src='https://images.unsplash.com/photo-1529156069898-49953e39b3ac?q=80&w=2000'" class="absolute inset-0 w-full h-full object-cover"><div class="absolute inset-0 bg-black/50"></div><div class="relative z-10 px-6"><div class="logo-oval grgs text-[22px] mb-6 border-white text-white">GRGS</div><p class="text-[11px] tracking-[0.35em]">GREGARIOUS CLUB</p><p class="serif italic text-[13px] mt-2 opacity-70">We're not just a brand.<br>We're a community.</p><h1 class="serif text-[56px] leading-[0.9] mt-6">UNITED<br>AS ONE</h1><a href="#shop" class="mt-10 inline-block border border-white px-12 py-4 rounded-full text-[12px] font-bold tracking-widest">SHOP NOW</a></div></section>
<section id="shop" class="max-w-[1300px] mx-auto px-4 py-12"><div class="text-center mb-10"><h2 class="bebas text-[44px]">SHOP COLLECTION</h2></div><div id="productGrid" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div></section>
<div id="cart" class="fixed inset-0 z-[100] hidden"><div class="absolute inset-0 bg-black/60" onclick="this.parentElement.classList.add('hidden')"></div><div class="absolute right-0 top-0 h-full w-[92%] md:w-[420px] bg-white p-6 flex flex-col"><div class="flex justify-between"><h3 class="bebas text-[28px]">CART (<span id="cartCountText">0</span>)</h3><button onclick="document.getElementById('cart').classList.add('hidden')">✕</button></div><div id="cartItems" class="flex-1 py-4 overflow-auto border-t mt-4"></div><div class="border-t pt-4"><div class="flex justify-between text-[11px]"><span>Subtotal</span><span id="subtotalText">Rp 0</span></div><div class="flex justify-between text-[11px] mt-1"><span>Ongkir</span><span id="ongkirText">Rp 0</span></div><div class="flex justify-between font-bold text-[16px] mt-3 pt-3 border-t"><span>TOTAL</span><span id="cartTotal">Rp 0</span></div><button onclick="openCheckout()" class="w-full bg-black text-white py-4 rounded-full mt-4 text-[11px] font-bold">CHECKOUT</button></div></div></div>
<div id="checkoutModal" class="fixed inset-0 z-[110] hidden"><div class="absolute inset-0 bg-black/70" onclick="this.parentElement.classList.add('hidden')"></div><div class="absolute bottom-0 md:top-1/2 md:left-1/2 md:-translate-x-1/2 md:-translate-y-1/2 bg-white w-full md:w-[440px] p-6 md:rounded-[20px]"><h3 class="bebas text-[28px]">CHECKOUT</h3><input id="custName" placeholder="Nama *" class="w-full border p-3 mt-4 text-sm"><input id="custWa" placeholder="WA *" class="w-full border p-3 mt-2 text-sm"><textarea id="custAddr" placeholder="Alamat Lengkap *" class="w-full border p-3 mt-2 text-sm h-[60px]"></textarea><select id="shipMethod" onchange="updateCart()" class="w-full border p-3 mt-2 text-xs"></select><div id="checkoutSummary" class="bg-gray-100 p-3 text-[11px] mt-3"></div><button onclick="placeOrder()" class="w-full bg-black text-white py-4 rounded-full mt-4 text-[11px] font-bold">PESAN VIA WA</button></div></div>
<footer class="bg-black text-white/40 py-8 text-center text-[10px]"><div class="logo-oval grgs text-white border-white mx-auto mb-2">GRGS</div>GREGARIOUS CLUB © 2026</footer>
<script>
let selected={},cart=[];
const shipSel=document.getElementById('shipMethod');
Object.entries(ONGKIR).forEach(([n,h])=>{let o=document.createElement('option');o.value=n;o.innerText=n+" - Rp "+h.toLocaleString('id-ID');shipSel.appendChild(o);});
function getOngkir(){let s=shipSel.value||Object.keys(ONGKIR)[0];let k=Object.keys(ONGKIR).find(k=>s.includes(k))||Object.keys(ONGKIR)[0];return ONGKIR[k]||0;}
function renderProducts(){let g=document.getElementById('productGrid');g.innerHTML='';Object.keys(PRODUCTS).forEach(id=>{let p=PRODUCTS[id];g.innerHTML+='<div class="border rounded-[16px] overflow-hidden bg-white"><div class="aspect-[4/5] bg-[#fafafa] relative"><img src="'+p.img+'" class="w-full h-full object-contain p-6"><\/div><div class="p-5"><h4 class="font-bold text-[13px]">'+p.name+'<\/h4><p class="font-bold mt-1">Rp '+p.price.toLocaleString('id-ID')+'<\/p><div class="flex gap-2 mt-3" id="sizes-'+id+'"><\/div><button onclick="addToCart(\\''+id+'\\')" class="w-full mt-3 bg-black text-white py-3 rounded-full text-[11px] font-bold">ADD TO CART<\/button><\/div><\/div>';});renderSizes();}
function renderSizes(){Object.keys(PRODUCTS).forEach(id=>{let cont=document.getElementById('sizes-'+id);if(!cont)return;cont.innerHTML='';Object.keys(PRODUCTS[id].stock).forEach(s=>{let q=PRODUCTS[id].stock[s];let b=document.createElement('button');b.innerText=s;b.className='border rounded-full w-9 h-9 text-[11px] font-bold '+(q==0?'opacity-20 line-through':'hover:bg-black hover:text-white');if(q==0)b.disabled=true;b.onclick=()=>{selected[id]=s;cont.querySelectorAll('button').forEach(x=>x.classList.remove('bg-black','text-white'));b.classList.add('bg-black','text-white');};cont.appendChild(b);});let f=Object.keys(PRODUCTS[id].stock).find(s=>PRODUCTS[id].stock[s]>0);if(f){selected[id]=f;setTimeout(()=>cont.querySelectorAll('button').forEach(b=>{if(b.innerText==f)b.click()}),100)}})}
function addToCart(id){let s=selected[id];if(!s)return alert('Pilih size');if(PRODUCTS[id].stock[s]<=0)return alert('Habis');if(cart.filter(i=>i.id==id&&i.size==s).length>=PRODUCTS[id].stock[s])return alert('Stok cuma '+PRODUCTS[id].stock[s]);cart.push({id,size:s,price:PRODUCTS[id].price,name:PRODUCTS[id].name});PRODUCTS[id].stock[s]--;updateCart();document.getElementById('cart').classList.remove('hidden');renderSizes();}
function updateCart(){document.getElementById('cartCount').innerText=cart.length;document.getElementById('cartCountText').innerText=cart.length;let sub=cart.reduce((a,b)=>a+b.price,0),ong=cart.length>0?getOngkir():0,tot=sub+ong;document.getElementById('subtotalText').innerText='Rp '+sub.toLocaleString('id-ID');document.getElementById('ongkirText').innerText='Rp '+ong.toLocaleString('id-ID');document.getElementById('cartTotal').innerText='Rp '+tot.toLocaleString('id-ID');document.getElementById('cartItems').innerHTML=cart.map((i,idx)=>'<div class="flex justify-between py-3 border-b text-[12px]"><span>'+i.name+' '+i.size+'<\/span><span>Rp '+i.price.toLocaleString('id-ID')+' <button onclick="removeItem('+idx+')">✕<\/button><\/span><\/div>').join('')||'<p class="text-center py-10 opacity-40 text-xs">Kosong<\/p>';document.getElementById('checkoutSummary').innerHTML=cart.map(i=>'• '+i.name+' '+i.size).join('<br>')+'<br><br>Subtotal Rp '+sub.toLocaleString('id-ID')+'<br>Ongkir Rp '+ong.toLocaleString('id-ID')+'<br><b>TOTAL Rp '+tot.toLocaleString('id-ID')+'<\/b>';}
function removeItem(i){PRODUCTS[cart[i].id].stock[cart[i].size]++;cart.splice(i,1);updateCart();renderSizes();}
function openCheckout(){if(!cart.length)return;document.getElementById('cart').classList.add('hidden');document.getElementById('checkoutModal').classList.remove('hidden');updateCart();}
function placeOrder(){let n=document.getElementById('custName').value,w=document.getElementById('custWa').value,a=document.getElementById('custAddr').value;if(!n||!w||!a)return alert('Lengkapi');let sub=cart.reduce((a,b)=>a+b.price,0),ong=getOngkir(),tot=sub+ong,ship=shipSel.value;let txt='ORDER GRGS%0A'+cart.map(i=>'- '+i.name+' '+i.size+' Rp '+i.price.toLocaleString('id-ID')).join('%0A')+'%0A%0ASubtotal Rp '+sub.toLocaleString('id-ID')+'%0AOngkir '+ship+' Rp '+ong.toLocaleString('id-ID')+'%0ATOTAL Rp '+tot.toLocaleString('id-ID')+'%0A%0ANama: '+n+'%0AWA: '+w+'%0AAlamat: '+a;window.open('https://wa.me/'+NO_WA+'?text='+txt,'_blank');}renderProducts();
<\/script></body></html>`;

  let blob=new Blob([html],{type:'text/html'});
  let url=URL.createObjectURL(blob);
  let a=document.createElement('a');
  a.href=url;
  a.download='index.html';
  a.click();
  document.getElementById('status').innerText='✅ index.html berhasil di-download! Upload ke GitHub timpa yang lama!';
  let out=document.getElementById('outputCode');
  out.classList.remove('hidden');
  out.value=html;
}
render();
</script>
</body>
</html>
