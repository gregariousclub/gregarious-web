<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GRGS ADMIN V8 - RATING + ORDER</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-[#f5f5f5] p-3 md:p-6">
<div class="max-w-[900px] mx-auto">
<div class="bg-black text-white p-5 rounded-[16px] flex justify-between items-center">
<div><h1 class="font-black text-[16px]">GRGS ADMIN V8 - RATING ⭐</h1><p class="text-[10px] opacity-60">RATING + REVIEW + ORDER MANAGEMENT</p></div>
<a href="/" class="bg-white text-black px-4 py-2 rounded-full text-[11px] font-bold">LIHAT TOKO</a>
</div>

<div class="flex gap-2 mt-4 overflow-x-auto">
<button onclick="showTab('orders')" id="tab_orders" class="bg-black text-white px-5 py-2.5 rounded-full text-[11px] font-bold whitespace-nowrap">📦 PESANAN (<span id="orderCount">0</span>)</button>
<button onclick="showTab('ratings')" id="tab_ratings" class="bg-white border px-5 py-2.5 rounded-full text-[11px] font-bold whitespace-nowrap">⭐ RATING & ULASAN</button>
<button onclick="showTab('products')" id="tab_products" class="bg-white border px-5 py-2.5 rounded-full text-[11px] font-bold whitespace-nowrap">👕 PRODUK</button>
<button onclick="showTab('ongkir')" id="tab_ongkir" class="bg-white border px-5 py-2.5 rounded-full text-[11px] font-bold whitespace-nowrap">🚚 ONGKIR</button>
<button onclick="showTab('setting')" id="tab_setting" class="bg-white border px-5 py-2.5 rounded-full text-[11px] font-bold whitespace-nowrap">⚙️ SETTING</button>
</div>

<!-- ORDERS -->
<div id="content_orders" class="bg-white p-5 rounded-[16px] border mt-4">
<div class="flex justify-between items-center mb-4"><h3 class="font-black text-[13px]">📦 DAFTAR PESANAN</h3><div class="flex gap-2"><select id="filterStatus" onchange="renderOrders()" class="border rounded-full px-3 py-1.5 text-[10px]"><option value="all">Semua</option><option value="pending">Menunggu</option><option value="paid">Sudah Bayar</option><option value="shipped">Dikirim</option></select><button onclick="exportOrders()" class="bg-green-600 text-white px-3 py-1.5 rounded-full text-[10px] font-bold">EXPORT</button></div></div>
<div id="orderList"></div>
</div>

<!-- RATINGS -->
<div id="content_ratings" class="bg-white p-5 rounded-[16px] border mt-4 hidden">
<h3 class="font-black text-[13px] mb-3">⭐ KELOLA RATING & ULASAN</h3>
<p class="text-[10px] opacity-60 mb-4">Tambah ulasan awal biar keliatan laris - nanti pembeli asli bisa nambah review sendiri di web!</p>
<div id="ratingList"></div>
<div class="mt-6 border-t pt-4">
<h4 class="font-bold text-[11px] mb-2">+ TAMBAH ULASAN MANUAL (buat testimoni awal)</h4>
<div class="grid grid-cols-2 gap-2">
<select id="newRatingProduct" class="border rounded-full px-3 py-2 text-[11px]"></select>
<select id="newRatingStar" class="border rounded-full px-3 py-2 text-[11px]"><option value="5">⭐⭐⭐⭐⭐ 5 Bintang</option><option value="4">⭐⭐⭐⭐ 4 Bintang</option><option value="3">⭐⭐⭐ 3 Bintang</option></select>
</div>
<input id="newRatingName" placeholder="Nama pembeli (contoh: Rizal - Bandung)" class="w-full border rounded-full px-3 py-2 mt-2 text-[11px]">
<textarea id="newRatingComment" placeholder="Komentar: Bahan adem, sablon tebal, pengiriman cepat!" class="w-full border rounded-[12px] px-3 py-2 mt-2 text-[11px] h-[60px]"></textarea>
<button onclick="addManualRating()" class="w-full bg-black text-white py-2.5 rounded-full text-[11px] font-bold mt-2">+ TAMBAH ULASAN</button>
</div>
</div>

<!-- PRODUCTS -->
<div id="content_products" class="bg-white p-5 rounded-[16px] border mt-4 hidden">
<div class="flex justify-between items-center mb-2"><h3 class="font-black text-[12px]">👕 PRODUK - <span id="pc">0</span></h3><button onclick="addProduct()" class="bg-black text-white px-4 py-2 rounded-full text-[10px] font-bold">+ TAMBAH</button></div>
<div id="productList" class="space-y-3"></div>
</div>

<!-- ONGKIR -->
<div id="content_ongkir" class="bg-white p-5 rounded-[16px] border mt-4 hidden">
<h3 class="font-black text-[12px] mb-3">🚚 ONGKIR</h3><div id="ongkirList" class="space-y-2"></div><button onclick="addOngkir()" class="w-full border border-dashed py-3 rounded-full text-[11px] font-bold mt-3">+ TAMBAH</button>
</div>

<!-- SETTING -->
<div id="content_setting" class="bg-white p-5 rounded-[16px] border mt-4 hidden">
<h3 class="font-black text-[12px] mb-3">⚙️ SETTING</h3>
<div class="grid grid-cols-2 gap-3"><div><label class="text-[10px] font-bold">NO WA</label><input id="wa" value="62881023595180" class="w-full border rounded-full px-4 py-2.5 text-[13px]"></div><div><label class="text-[10px] font-bold">RUNNING TEXT</label><input id="running" value="⭐ RATING 4.9/5 • TERJUAL 1000+ PCS • BANDUNG 40614" class="w-full border rounded-full px-4 py-2.5 text-[11px]"></div></div>
<div class="grid grid-cols-2 gap-3 mt-3"><div><label class="text-[10px] font-bold">BRI</label><input id="rek_bri" value="074901024253504" class="w-full border rounded-full px-4 py-2 text-[12px]"><input id="nama_bri" value="RIZAL FARUK HAYDAR" class="w-full border rounded-full px-4 py-2 text-[10px] mt-1"></div><div><label class="text-[10px] font-bold">SEABANK</label><input id="rek_seabank" value="901100694312" class="w-full border rounded-full px-4 py-2 text-[12px]"><input id="nama_seabank" value="RIZAL FARUK HAYDAR" class="w-full border rounded-full px-4 py-2 text-[10px] mt-1"></div></div>
</div>

<div class="bg-black text-white p-5 rounded-[16px] mt-4">
<button onclick="downloadNewIndex()" class="w-full bg-white text-black py-4 rounded-full font-black text-[12px]">⬇️ DOWNLOAD INDEX.HTML - ADA RATING ⭐</button>
<p id="status" class="text-[11px] mt-3 text-center opacity-70"></p>
</div>
</div>

<script>
let products=[
  {id:"CROSS_BLACK",name:"CROSS TSHIRT - BLACK",price:145000,img:"cross_black.jpg",stock:{S:0,M:0,L:2,XL:0},sold:18,initial:20,rating:{avg:4.9,count:23}},
  {id:"CROSS_WHITE",name:"CROSS TSHIRT - WHITE",price:145000,img:"cross_white.jpg",stock:{S:0,M:3,L:2,XL:1},sold:14,initial:20,rating:{avg:4.8,count:18}},
  {id:"BABY_BLACK",name:"BABYTEE RHINESTONE - BLACK",price:135000,img:"babytee_black.jpg",stock:{S:4,M:5,L:5,XL:0},sold:6,initial:20,rating:{avg:5.0,count:31}},
  {id:"BABY_WHITE",name:"BABYTEE RHINESTONE - WHITE",price:135000,img:"babytee_white.jpg",stock:{S:5,M:5,L:5,XL:0},sold:5,initial:20,rating:{avg:4.9,count:12}}
];
let ongkir={
  "BANDUNG RAYA - JNE OKE":10000,
  "JABODETABEK - JNE REG":13000,
  "JABODETABEK - JNE YES":18000,
  "JAWA BARAT - JNE REG":13000,
  "JAWA TENGAH/DIY - JNE REG":18000,
  "JAWA TIMUR - JNE REG":21000,
  "SUMATERA - JNE REG":35000,
  "KALIMANTAN/SULAWESI/BALI":40000,
  "PAPUA/MALUKU":85000
};
let ratings=JSON.parse(localStorage.getItem('GRGS_RATINGS')||'{}');
if(Object.keys(ratings).length==0){
  ratings={
    "CROSS_BLACK":[{name:"Andra - Jakarta",star:5,comment:"Sablon tebel banget! Bahan adem, gak nerawang. Worth it!",date:"2026-09-28"},{name:"Dimas - Bandung",star:5,comment:"Udah 3x cuci masih bagus, gak retak!",date:"2026-09-25"}],
    "CROSS_WHITE":[{name:"Sinta - Surabaya",star:5,comment:"Putihnya gak transparan, cuttingan oversize pas!",date:"2026-09-20"}],
    "BABY_BLACK":[{name:"Citra - Bandung",star:5,comment:"BABYTEE nya lucu parah! Rhinestone nya blink ✨",date:"2026-09-29"},{name:"Naya - Jaksel",star:5,comment:"Dipake nongkrong dapet banyak pujian! Bahan stretch adem",date:"2026-09-27"},{name:"Rara - Jogja",star:5,comment:"Pengiriman cepet, packing aman. Love GRGS!",date:"2026-09-26"}],
    "BABY_WHITE":[{name:"Luna - Bali",star:5,comment:"Putihnya cakep, gak gampang kotor!",date:"2026-09-24"}]
  };
  localStorage.setItem('GRGS_RATINGS', JSON.stringify(ratings));
}

function showTab(t){
  ['orders','ratings','products','ongkir','setting'].forEach(x=>{
    document.getElementById('content_'+x).classList.add('hidden');
    document.getElementById('tab_'+x).className='bg-white border px-5 py-2.5 rounded-full text-[11px] font-bold whitespace-nowrap';
  });
  document.getElementById('content_'+t).classList.remove('hidden');
  document.getElementById('tab_'+t).className='bg-black text-white px-5 py-2.5 rounded-full text-[11px] font-bold whitespace-nowrap';
  if(t=='orders') renderOrders();
  if(t=='ratings') renderRatings();
}

function getOrders(){try{return JSON.parse(localStorage.getItem('GRGS_ORDERS')||'[]')}catch(e){return []}}
function saveOrders(o){localStorage.setItem('GRGS_ORDERS', JSON.stringify(o))}
function renderOrders(){
  let orders=getOrders();let filter=document.getElementById('filterStatus').value;
  if(filter!=='all') orders=orders.filter(o=>o.status===filter);
  document.getElementById('orderCount').innerText=getOrders().length;
  let list=document.getElementById('orderList');
  if(orders.length==0){list.innerHTML='<div class="text-center py-12 opacity-40 text-[11px]">Belum ada pesanan</div>';return;}
  list.innerHTML='';orders.slice().reverse().forEach(o=>{
    let color=o.status==='pending'?'bg-yellow-100 text-yellow-700':o.status==='paid'?'bg-green-100 text-green-700':'bg-blue-100 text-blue-700';
    let div=document.createElement('div');div.className='border rounded-[12px] p-4 mb-3';
    div.innerHTML='<div class="flex justify-between"><p class="font-mono font-bold text-[12px]">#'+o.id+'</p><span class="px-3 py-1 rounded-full text-[10px] font-bold '+color+'">'+o.status.toUpperCase()+'</span></div><div class="text-[11px] mt-2"><b>'+o.name+'</b> - '+o.wa+'<br>'+o.addr+'<br><br>'+o.cart.map(c=>c.name+' '+c.size).join('<br>')+'<br><b>Rp '+o.tot.toLocaleString('id-ID')+'</b></div><div class="flex gap-2 mt-3"><button onclick="updateStatus(\''+o.id+'\',\'paid\')" class="bg-green-600 text-white px-3 py-1.5 rounded-full text-[10px] font-bold">✅ BAYAR</button><button onclick="updateStatus(\''+o.id+'\',\'shipped\')" class="bg-blue-600 text-white px-3 py-1.5 rounded-full text-[10px] font-bold">📦 KIRIM</button><button onclick="deleteOrder(\''+o.id+'\')" class="text-red-500 text-[10px]">HAPUS</button></div>';
    list.appendChild(div);
  });
}
function updateStatus(id,s){let o=getOrders();let x=o.find(z=>z.id===id);if(x){x.status=s;saveOrders(o);renderOrders();}}
function deleteOrder(id){if(confirm('Hapus?')){saveOrders(getOrders().filter(x=>x.id!==id));renderOrders();}}
function exportOrders(){let o=getOrders();if(!o.length)return alert('Kosong');let csv='ID,Waktu,Nama,WA,Alamat,Produk,Total,Status\n'+o.map(x=>'"'+x.id+'","'+x.time+'","'+x.name+'","'+x.wa+'","'+x.addr+'","'+x.cart.map(c=>c.name+' '+c.size).join('; ')+'","'+x.tot+'","'+x.status+'"').join('\n');let blob=new Blob([csv],{type:'text/csv'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='GRGS_ORDERS.csv';a.click();}

function renderRatings(){
  let sel=document.getElementById('newRatingProduct');sel.innerHTML='';products.forEach(p=>{let o=document.createElement('option');o.value=p.id;o.textContent=p.name;sel.appendChild(o);});
  let list=document.getElementById('ratingList');list.innerHTML='';
  products.forEach(p=>{
    let revs=ratings[p.id]||[];let avg=revs.length? (revs.reduce((a,b)=>a+b.star,0)/revs.length).toFixed(1): (p.rating.avg||5.0);
    let div=document.createElement('div');div.className='border rounded-[12px] p-4 mb-3';
    div.innerHTML='<div class="flex justify-between"><div><p class="font-bold text-[12px]">'+p.name+'</p><p class="text-[11px]">⭐ '+avg+' ('+revs.length+' ulasan) • Terjual '+p.sold+'</p></div><button onclick="clearProductRatings(\''+p.id+'\')" class="text-red-500 text-[10px]">HAPUS ULASAN</button></div><div class="mt-3 space-y-2 max-h-[200px] overflow-auto">'+(revs.length?revs.map(r=>'<div class="bg-gray-50 p-2 rounded-[8px] text-[10px]"><b>'+r.name+'</b> - '+('⭐'.repeat(r.star))+'<br>'+r.comment+'<br><span class="opacity-50">'+r.date+'</span></div>').join(''):'<p class="text-[10px] opacity-50">Belum ada ulasan</p>')+'</div>';
    list.appendChild(div);
  });
}
function addManualRating(){
  let pid=document.getElementById('newRatingProduct').value;
  let star=parseInt(document.getElementById('newRatingStar').value);
  let name=document.getElementById('newRatingName').value.trim();
  let comment=document.getElementById('newRatingComment').value.trim();
  if(!name||!comment)return alert('Isi nama & komentar!');
  if(!ratings[pid]) ratings[pid]=[];
  ratings[pid].push({name,star,comment,date:new Date().toISOString().slice(0,10)});
  localStorage.setItem('GRGS_RATINGS', JSON.stringify(ratings));
  document.getElementById('newRatingName').value='';document.getElementById('newRatingComment').value='';
  renderRatings();document.getElementById('status').innerText='✅ Ulasan ditambahkan untuk '+pid;
}
function clearProductRatings(pid){if(confirm('Hapus semua ulasan '+pid+'?')){ratings[pid]=[];localStorage.setItem('GRGS_RATINGS', JSON.stringify(ratings));renderRatings();}}

function render(){
  document.getElementById('pc').innerText=products.length;
  let pl=document.getElementById('productList');pl.innerHTML='';
  products.forEach((p, idx)=>{
    let total=Object.values(p.stock).reduce((a,b)=>a+b,0);
    let el=document.createElement('div');el.className='border rounded-[12px] p-3 bg-[#fafafa]';
    el.innerHTML='<div class="flex justify-between items-center"><input id="pid_'+idx+'" value="'+p.id+'" class="font-mono text-[10px] font-bold bg-white border px-2 py-1 rounded w-[110px]"><span class="text-[9px] bg-black text-white px-2 py-1 rounded-full">SISA '+total+'</span><button onclick="delProduct('+idx+')" class="text-red-500 text-[10px] font-bold">HAPUS</button></div><input id="pname_'+idx+'" value="'+p.name+'" class="w-full border rounded-full px-3 py-2 mt-2 text-[12px] font-bold"><div class="grid grid-cols-3 gap-2 mt-2"><div><label class="text-[9px]">HARGA</label><input id="pprice_'+idx+'" type="number" value="'+p.price+'" class="w-full border rounded-full px-2 py-2 text-[12px] font-bold"></div><div><label class="text-[9px]">TERJUAL</label><input id="psold_'+idx+'" type="number" value="'+p.sold+'" class="w-full border rounded-full px-2 py-2 text-[12px] font-bold bg-yellow-100"></div><div><label class="text-[9px]">AWAL</label><input id="pinitial_'+idx+'" type="number" value="'+p.initial+'" class="w-full border rounded-full px-2 py-2 text-[12px] font-bold"></div></div><input id="pimg_'+idx+'" value="'+p.img+'" class="w-full border rounded-full px-3 py-2 text-[11px] mt-2"><div class="grid grid-cols-4 gap-2 mt-2"><div><label class="text-[9px]">S</label><input id="ps_'+idx+'" type="number" value="'+(p.stock.S||0)+'" class="w-full border rounded-full py-2 text-center text-[12px] font-bold"></div><div><label class="text-[9px]">M</label><input id="pm_'+idx+'" type="number" value="'+(p.stock.M||0)+'" class="w-full border rounded-full py-2 text-center text-[12px] font-bold"></div><div><label class="text-[9px]">L</label><input id="pl_'+idx+'" type="number" value="'+(p.stock.L||0)+'" class="w-full border rounded-full py-2 text-center text-[12px] font-bold"></div><div><label class="text-[9px]">XL</label><input id="pxl_'+idx+'" type="number" value="'+(p.stock.XL||0)+'" class="w-full border rounded-full py-2 text-center text-[12px] font-bold"></div></div><button onclick="saveProduct('+idx+')" class="w-full bg-black text-white py-2 rounded-full text-[10px] font-bold mt-2">💾 SAVE</button>';
    pl.appendChild(el);
  });
  let ol=document.getElementById('ongkirList');ol.innerHTML='';let i=0;for(let k in ongkir){let row=document.createElement('div');row.className='flex gap-2 items-center';row.innerHTML='<input id="ok_name_'+i+'" value="'+k+'" class="flex-1 border rounded-full px-3 py-2 text-[10px]"><input id="ok_price_'+i+'" type="number" value="'+ongkir[k]+'" class="w-[90px] border rounded-full px-2 py-2 text-[11px] font-bold"><button onclick="delOngkir(\''+k.replace(/'/g,"\\'")+'\')" class="text-red-500 font-bold">✕</button>';ol.appendChild(row);i++;}
}
function saveProduct(i){products[i].id=document.getElementById('pid_'+i).value;products[i].name=document.getElementById('pname_'+i).value;products[i].price=parseInt(document.getElementById('pprice_'+i).value)||0;products[i].sold=parseInt(document.getElementById('psold_'+i).value)||0;products[i].initial=parseInt(document.getElementById('pinitial_'+i).value)||20;products[i].img=document.getElementById('pimg_'+i).value;products[i].stock.S=parseInt(document.getElementById('ps_'+i).value)||0;products[i].stock.M=parseInt(document.getElementById('pm_'+i).value)||0;products[i].stock.L=parseInt(document.getElementById('pl_'+i).value)||0;products[i].stock.XL=parseInt(document.getElementById('pxl_'+i).value)||0;document.getElementById('status').innerText='✅ '+products[i].name+' SAVED';}
function delProduct(i){products.splice(i,1);render();}
function delOngkir(k){delete ongkir[k];render();}
function addProduct(){products.push({id:"BARU_"+Date.now(),name:"PRODUK BARU",price:135000,img:"foto_baru.jpg",stock:{S:5,M:5,L:5,XL:0},sold:0,initial:20,rating:{avg:5.0,count:0}});render();}
function addOngkir(){ongkir["Kurir Baru - "+Date.now()]=15000;render();}

function downloadNewIndex(){
  for(let i=0;i<products.length;i++){if(document.getElementById('pid_'+i))saveProduct(i);}
  let newOngkir={};let idx=0;for(let oldK in ongkir){let nameEl=document.getElementById('ok_name_'+idx);let priceEl=document.getElementById('ok_price_'+idx);if(nameEl && priceEl){newOngkir[nameEl.value]=parseInt(priceEl.value)||0;}idx++;}ongkir=newOngkir;
  let wa=document.getElementById('wa').value;
  let running=document.getElementById('running').value;
  let rek_bri=document.getElementById('rek_bri').value;
  let nama_bri=document.getElementById('nama_bri').value;
  let rek_seabank=document.getElementById('rek_seabank').value;
  let nama_seabank=document.getElementById('nama_seabank').value;
  let productsObj={};products.forEach(p=>{productsObj[p.id]={name:p.name,price:p.price,img:p.img,stock:p.stock,sold:p.sold,initial:p.initial,rating:p.rating}});
  let ratingsData=localStorage.getItem('GRGS_RATINGS')||'{}';
  let htmlContent = `<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GREGARIOUS CLUB</title><script src="https://cdn.tailwindcss.com"><\/script><link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;700;900&family=Bebas+Neue&display=swap" rel="stylesheet"><style>.serif{font-family:'Instrument Serif',serif}.bebas{font-family:'Bebas Neue',sans-serif}.grgs{font-family:'Inter',sans-serif;font-weight:900}.logo-oval{border:2.5px solid currentColor;border-radius:50%;padding:7px 24px;display:inline-block}.marquee{animation:marquee 25s linear infinite;display:inline-flex;white-space:nowrap}@keyframes marquee{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}.size-btn.active{background:black;color:white}.pulse{animation:pulse 1.5s infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.6}}<\/style></head><body class="bg-white text-black">
<script>const NO_WA="${wa}";const REK_BRI="${rek_bri}";const NAMA_BRI="${nama_bri}";const REK_SEABANK="${rek_seabank}";const NAMA_SEABANK="${nama_seabank}";const PRODUCTS=${JSON.stringify(productsObj)};const ONGKIR=${JSON.stringify(ongkir)};const INITIAL_RATINGS=${ratingsData};<\/script>
<div class="bg-black text-white py-2.5 overflow-hidden whitespace-nowrap"><div class="marquee text-[11px] tracking-[0.25em] font-bold"><span class="mx-10">✦ ${running} ✦</span><span class="mx-10">✦ ${running} ✦</span></div></div>
<header class="sticky top-0 z-40 bg-white/95 backdrop-blur border-b flex justify-between items-center px-6 py-4"><div class="logo-oval grgs">GRGS</div><button onclick="document.getElementById('cart').classList.remove('hidden')" class="border border-black px-5 py-2 rounded-full text-[11px] font-bold">CART <span id="cartCount">0</span></button></header>
<section id="shop" class="max-w-[1300px] mx-auto px-4 py-12"><div class="text-center mb-10"><h2 class="bebas text-[44px]">SHOP COLLECTION</h2><p class="text-[11px] tracking-widest opacity-50">⭐ RATING 4.9/5 • TERJUAL 1000+ PCS</p></div><div id="productGrid" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div></section>
<div id="reviewModal" class="fixed inset-0 z-[105] hidden"><div class="absolute inset-0 bg-black/60" onclick="this.parentElement.classList.add('hidden')"></div><div class="absolute bottom-0 md:top-1/2 md:left-1/2 md:-translate-x-1/2 md:-translate-y-1/2 bg-white w-full md:w-[520px] p-6 md:rounded-[20px] max-h-[85vh] overflow-auto"><div class="flex justify-between items-center"><h3 class="bebas text-[24px]">ULASAN PEMBELI</h3><button onclick="document.getElementById('reviewModal').classList.add('hidden')" class="font-bold">✕</button></div><div id="reviewContent" class="mt-4"></div><div class="mt-6 border-t pt-4"><h4 class="font-bold text-[11px]">Tulis Ulasan Lu</h4><div class="flex gap-1 mt-2" id="starPicker"><button onclick="pickStar(1)" class="text-[24px]">☆</button><button onclick="pickStar(2)" class="text-[24px]">☆</button><button onclick="pickStar(3)" class="text-[24px]">☆</button><button onclick="pickStar(4)" class="text-[24px]">☆</button><button onclick="pickStar(5)" class="text-[24px]">☆</button></div><input id="reviewerName" placeholder="Nama lu" class="w-full border rounded-full px-4 py-2.5 mt-3 text-[12px]"><textarea id="reviewerComment" placeholder="Gimana produknya? Bahan adem gak? Sablon awet?" class="w-full border rounded-[12px] px-4 py-3 mt-2 text-[12px] h-[70px]"></textarea><button onclick="submitReview()" class="w-full bg-black text-white py-3 rounded-full text-[11px] font-bold mt-3">KIRIM ULASAN ⭐</button></div></div></div>
<div id="cart" class="fixed inset-0 z-[100] hidden"><div class="absolute inset-0 bg-black/60" onclick="this.parentElement.classList.add('hidden')"></div><div class="absolute right-0 top-0 h-full w-[92%] md:w-[420px] bg-white p-6 flex flex-col"><div class="flex justify-between items-center"><h3 class="bebas text-[28px]">CART (<span id="cartCountText">0</span>)</h3><button onclick="document.getElementById('cart').classList.add('hidden')" class="font-bold">✕</button></div><div id="cartItems" class="flex-1 py-4 overflow-auto border-t mt-4"></div><div class="border-t pt-4"><div class="flex justify-between text-[11px]"><span>Subtotal</span><span id="subtotalText">Rp 0</span></div><div class="flex justify-between text-[11px] mt-1"><span>Ongkir</span><span id="ongkirText">Rp 0</span></div><div class="flex justify-between font-bold text-[16px] mt-3 pt-3 border-t"><span>TOTAL</span><span id="cartTotal">Rp 0</span></div><button onclick="openCheckout()" class="w-full bg-black text-white py-4 rounded-full mt-4 text-[11px] font-bold tracking-widest">CHECKOUT & BAYAR →</button></div></div></div>
<div id="checkoutModal" class="fixed inset-0 z-[110] hidden"><div class="absolute inset-0 bg-black/70" onclick="this.parentElement.classList.add('hidden')"></div><div class="absolute bottom-0 md:top-1/2 md:left-1/2 md:-translate-x-1/2 md:-translate-y-1/2 bg-white w-full md:w-[460px] p-6 md:rounded-[20px] max-h-[95vh] overflow-auto"><h3 class="bebas text-[28px]">CHECKOUT</h3><input id="custName" placeholder="Nama *" class="w-full border p-3 mt-4 text-[13px] rounded-full px-4"><input id="custWa" placeholder="WA *" class="w-full border p-3 mt-2 text-[13px] rounded-full px-4"><textarea id="custAddr" placeholder="Alamat lengkap *" class="w-full border p-3 mt-2 text-[13px] rounded-[16px] px-4 h-[70px]"></textarea><select id="shipMethod" onchange="updateCart()" class="w-full border p-3 mt-2 text-[12px] rounded-full px-4"></select><div id="checkoutSummary" class="bg-gray-100 p-4 text-[11px] mt-4 rounded-[12px]"></div><button onclick="processPayment()" class="w-full bg-black text-white py-4 rounded-full mt-4 text-[11px] font-bold">LANJUT →</button></div></div>
<div id="paymentModal" class="fixed inset-0 z-[120] hidden bg-white overflow-auto"><div class="max-w-[460px] mx-auto min-h-screen p-6"><div class="flex justify-between items-center"><button onclick="document.getElementById('paymentModal').classList.add('hidden')" class="text-[12px] font-bold">← KEMBALI</button><p class="text-[10px] opacity-50">PEMBAYARAN AMAN</p></div><div class="text-center mt-6"><p class="text-[11px] opacity-60">TOTAL PEMBAYARAN</p><h2 id="payTotal" class="bebas text-[40px] mt-1">Rp 0</h2><p class="text-[10px] opacity-60 mt-1">Order ID: <span id="orderId" class="font-mono font-bold">#GRGS000</span></p></div><div id="payDetails" class="mt-8"></div><button onclick="confirmPayment()" class="w-full bg-black text-white py-4 rounded-full mt-6 text-[12px] font-black">✅ SAYA SUDAH BAYAR</button></div></div>
<div id="successModal" class="fixed inset-0 z-[130] hidden bg-white"><div class="max-w-[460px] mx-auto min-h-screen p-6 flex flex-col items-center justify-center text-center"><div class="w-20 h-20 bg-green-500 rounded-full flex items-center justify-center text-[32px] text-white">✓</div><h2 class="bebas text-[36px] mt-6">PESANAN<br>TERSIMPAN!</h2><div id="successDetails" class="bg-gray-100 p-4 rounded-[12px] mt-6 text-[11px] w-full text-left"></div><button onclick="location.reload()" class="w-full bg-black text-white py-4 rounded-full mt-8 text-[11px] font-bold">KEMBALI KE TOKO</button></div></div>
<footer class="bg-black text-white/40 py-10 text-center text-[10px] tracking-widest">GRGS © 2026 • ⭐ 4.9/5 (87 Ulasan) • BANDUNG 40614</footer>
<script>
let selected={},cart=[],currentReviewProduct=null,currentStar=5;
const shipSel=document.getElementById('shipMethod');Object.entries(ONGKIR).forEach(([n,h])=>{let o=document.createElement('option');o.value=n;o.textContent=n+" - Rp "+h.toLocaleString('id-ID');shipSel.appendChild(o);});function getOngkir(){return ONGKIR[shipSel.value]||10000;}
function getStoredRatings(){try{return JSON.parse(localStorage.getItem('GRGS_RATINGS')||JSON.stringify(INITIAL_RATINGS))}catch(e){return INITIAL_RATINGS}}
function saveStoredRatings(r){localStorage.setItem('GRGS_RATINGS', JSON.stringify(r))}
function calcAvg(revs){if(!revs||!revs.length)return 5.0;return (revs.reduce((a,b)=>a+b.star,0)/revs.length).toFixed(1)}
function getBadge(total,percent){if(total==0)return '<span class="bg-red-600 text-white text-[9px] px-3 py-1.5 rounded-full font-bold pulse">SOLD OUT</span>';if(percent>=90)return '<span class="bg-red-600 text-white text-[9px] px-3 py-1.5 rounded-full font-bold pulse">🔥 HAMPIR HABIS! '+percent+'%</span>';return '<span class="bg-black text-white text-[9px] px-3 py-1.5 rounded-full font-bold">TERSEDIA</span>';}
function renderProducts(){let g=document.getElementById('productGrid');g.innerHTML='';let allRatings=getStoredRatings();Object.keys(PRODUCTS).forEach(id=>{let p=PRODUCTS[id];let revs=allRatings[id]||[];let avg=calcAvg(revs);let totalSisa=Object.values(p.stock).reduce((a,b)=>a+b,0);let totalAwal=p.initial||20;let terjual=p.sold||(totalAwal-totalSisa);let percent=Math.round((terjual/totalAwal)*100);let badge=getBadge(totalSisa,percent);let sizeInfo=Object.entries(p.stock).filter(([s,q])=>q>0).map(([s,q])=>s+'('+q+')').join(' • ')||'HABIS';let barColor=percent>=90?'bg-red-600':'bg-black';g.innerHTML+='<div class="border rounded-[20px] overflow-hidden bg-white"><div class="aspect-[4/5] bg-[#fafafa] relative flex items-center justify-center"><img src="'+p.img+'" onerror="this.src=\\'https://via.placeholder.com/400x500?text='+p.name+'\\'" class="w-full h-full object-contain p-8"><div class="absolute top-4 left-4">'+badge+'</div><div class="absolute top-4 right-4 bg-white/90 px-2.5 py-1 rounded-full text-[9px] font-bold border">'+sizeInfo+'</div></div><div class="p-5"><div class="flex justify-between items-start"><h4 class="font-bold text-[13px]">'+p.name+'</h4><button onclick="openReviews(\\''+id+'\\')" class="text-[11px] underline">Lihat ulasan</button></div><p class="font-black text-[14px] mt-1">Rp '+p.price.toLocaleString('id-ID')+'</p><div class="flex items-center gap-2 mt-2"><span class="text-[13px]">⭐ '+avg+'</span><span class="text-[11px] opacity-60">('+revs.length+' ulasan) • Terjual '+terjual+'</span></div><div class="mt-3"><div class="flex justify-between text-[10px] mb-1"><span class="font-bold '+(percent>=90?'text-red-600':'')+'">'+(percent>=90?'🔥 TINGGAL '+totalSisa+' LAGI!':'Terjual '+terjual+' dari '+totalAwal)+'</span><span class="opacity-60">'+percent+'% terjual</span></div><div class="w-full bg-gray-200 rounded-full h-2 overflow-hidden"><div class="h-2 rounded-full '+barColor+'" style="width:'+percent+'%"></div></div></div><div class="flex gap-2 mt-4" id="sizes-'+id+'"></div><button onclick="addToCart(\\''+id+'\\')" class="w-full mt-4 bg-black text-white py-3.5 rounded-full text-[11px] font-bold" '+(totalSisa==0?'disabled':'')+'>'+(totalSisa==0?'SOLD OUT':'ADD TO CART')+'</button></div></div>';});renderSizes();}
function renderSizes(){Object.keys(PRODUCTS).forEach(id=>{let cont=document.getElementById('sizes-'+id);if(!cont)return;cont.innerHTML='';Object.keys(PRODUCTS[id].stock).forEach(s=>{let q=PRODUCTS[id].stock[s];let b=document.createElement('button');b.textContent=q==0?s+' ✕':s+' ('+q+')';b.className='size-btn border rounded-full px-3 h-10 text-[11px] font-bold '+(q==0?'opacity-20':'');if(q==0)b.disabled=true;b.onclick=()=>{selected[id]=s;cont.querySelectorAll('button').forEach(x=>x.classList.remove('active'));b.classList.add('active');};cont.appendChild(b);});let first=Object.keys(PRODUCTS[id].stock).find(s=>PRODUCTS[id].stock[s]>0);if(first){selected[id]=first;}});}
function openReviews(id){currentReviewProduct=id;let all=getStoredRatings();let revs=all[id]||[];let avg=calcAvg(revs);let p=PRODUCTS[id];document.getElementById('reviewModal').classList.remove('hidden');document.getElementById('reviewContent').innerHTML='<div class="text-center border-b pb-4"><p class="bebas text-[48px]">'+avg+'</p><p>⭐⭐⭐⭐⭐</p><p class="text-[11px] opacity-60 mt-1">'+revs.length+' ulasan • '+p.sold+' terjual</p></div><div class="mt-4 space-y-3 max-h-[300px] overflow-auto">'+(revs.length?revs.map(r=>'<div class="border-b pb-3"><div class="flex justify-between"><b class="text-[11px]">'+r.name+'</b><span class="text-[11px]">'+('⭐'.repeat(r.star))+'</span></div><p class="text-[11px] mt-1">'+r.comment+'</p><p class="text-[9px] opacity-50 mt-1">'+r.date+'</p></div>').join(''):'<p class="text-[11px] opacity-50 text-center py-8">Belum ada ulasan - jadi yang pertama!</p>')+'</div>';}
function pickStar(n){currentStar=n;document.querySelectorAll('#starPicker button').forEach((b,i)=>{b.textContent=i<n?'★':'☆';});}
function submitReview(){let name=document.getElementById('reviewerName').value.trim();let comment=document.getElementById('reviewerComment').value.trim();if(!name||!comment)return alert('Isi nama & komentar!');let all=getStoredRatings();if(!all[currentReviewProduct]) all[currentReviewProduct]=[];all[currentReviewProduct].push({name,star:currentStar,comment,date:new Date().toISOString().slice(0,10)});saveStoredRatings(all);document.getElementById('reviewerName').value='';document.getElementById('reviewerComment').value='';pickStar(5);openReviews(currentReviewProduct);renderProducts();alert('✅ Ulasan lu kesimpan! Makasih bos!');}
function addToCart(id){let s=selected[id];if(!s)return alert('Pilih size!');if(PRODUCTS[id].stock[s]<=0)return alert('Habis!');cart.push({id,size:s,price:PRODUCTS[id].price,name:PRODUCTS[id].name});PRODUCTS[id].stock[s]--;updateCart();document.getElementById('cart').classList.remove('hidden');renderProducts();}
function updateCart(){document.getElementById('cartCount').textContent=cart.length;let sub=cart.reduce((a,b)=>a+b.price,0),ong=cart.length>0?getOngkir():0,tot=sub+ong;document.getElementById('subtotalText').textContent='Rp '+sub.toLocaleString('id-ID');document.getElementById('ongkirText').textContent='Rp '+ong.toLocaleString('id-ID');document.getElementById('cartTotal').textContent='Rp '+tot.toLocaleString('id-ID');document.getElementById('cartItems').innerHTML=cart.length==0?'<p class="text-center py-16 opacity-30 text-[12px]">Kosong</p>':cart.map((it,idx)=>'<div class="flex justify-between py-3 border-b text-[12px]"><div><b>'+it.name+'</b><br><span class="text-[11px] opacity-60">Size '+it.size+'</span></div><div class="text-right">Rp '+it.price.toLocaleString('id-ID')+'<br><button onclick="removeItem('+idx+')" class="text-red-500 text-[10px]">HAPUS</button></div></div>').join('');document.getElementById('checkoutSummary').innerHTML=cart.map(i=>'• '+i.name+' '+i.size).join('<br>')+'<br><br>Subtotal Rp '+sub.toLocaleString('id-ID')+'<br>Ongkir '+shipSel.value+' Rp '+ong.toLocaleString('id-ID')+'<br><b>TOTAL Rp '+tot.toLocaleString('id-ID')+'</b>';}
function removeItem(i){PRODUCTS[cart[i].id].stock[cart[i].size]++;cart.splice(i,1);updateCart();renderProducts();}
function openCheckout(){if(!cart.length)return;document.getElementById('cart').classList.add('hidden');document.getElementById('checkoutModal').classList.remove('hidden');updateCart();}
function getOrders(){try{return JSON.parse(localStorage.getItem('GRGS_ORDERS')||'[]')}catch(e){return []}}
function saveOrders(o){localStorage.setItem('GRGS_ORDERS', JSON.stringify(o))}
function processPayment(){let n=document.getElementById('custName').value.trim(),w=document.getElementById('custWa').value.trim(),a=document.getElementById('custAddr').value.trim();if(!n||!w||!a)return alert('Lengkapi!');let sub=cart.reduce((a,b)=>a+b.price,0),ong=getOngkir(),tot=sub+ong;let orderId='GRGS'+Date.now().toString().slice(-6);let order={id:orderId,name:n,wa:w,addr:a,ship:shipSel.value,sub,ong,tot,cart:[...cart],method:'BRI/SeaBank',time:new Date().toISOString(),status:'pending'};window._currentOrder=order;document.getElementById('checkoutModal').classList.add('hidden');document.getElementById('paymentModal').classList.remove('hidden');document.getElementById('orderId').textContent='#'+orderId;document.getElementById('payTotal').textContent='Rp '+tot.toLocaleString('id-ID');document.getElementById('payDetails').innerHTML='<div class="border-2 border-black rounded-[16px] p-5"><p class="text-[20px] font-mono font-black">${rek_bri} (BRI)</p><p class="text-[20px] font-mono font-black">${rek_seabank} (SeaBank)</p><p class="text-[12px]">An. ${nama_bri}</p><div class="bg-yellow-100 p-3 rounded-[10px] mt-4 text-[11px]">Transfer tepat <b>Rp '+tot.toLocaleString('id-ID')+'</b></div></div>';}
function confirmPayment(){let order=window._currentOrder;order.status='paid';let orders=getOrders();orders.push(order);saveOrders(orders);let rawText='🔔 PESANAN BARU #'+order.id+'\\nNama: '+order.name+'\\nWA: '+order.wa+'\\nTotal: Rp '+order.tot.toLocaleString('id-ID');window.open('https://wa.me/${wa}?text='+encodeURIComponent(rawText),'_blank');document.getElementById('paymentModal').classList.add('hidden');document.getElementById('successModal').classList.remove('hidden');document.getElementById('successDetails').innerHTML='Order '+order.id+' - Rp '+order.tot.toLocaleString('id-ID');}
pickStar(5);renderProducts();updateCart();
<\/script></body></html>`;

  let blob=new Blob([htmlContent],{type:'text/html'});
  let url=URL.createObjectURL(blob);
  let a=document.createElement('a');
  a.href=url;
  a.download='index.html';
  a.click();
  document.getElementById('status').innerText='✅ index.html dengan RATING ⭐ berhasil di-download!';
}
render();
renderOrders();
renderRatings();
</script>
</body></html>
