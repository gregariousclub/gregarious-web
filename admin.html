iv></div><button onclick="saveProduct(${idx})" class="w-full bg-black text-white py-2 rounded-full text-[10px] font-bold mt-2">💾 SAVE</button>`;

}
function saveProduct(i){products[i].id=document.getElementById('pid_'+i).value;products[i].name=document.getElementById('pname_'+i).value;products[i].price=parseInt(document.getElementById('pprice_'+i).value);products[i].img=document.getElementById('pimg_'+i).value;products[i].sold=parseInt(document.getElementById('psold_'+i).value);products[i].initial=parseInt(document.getElementById('pinitial_'+i).value);products[i].stock.S=parseInt(document.getElementById('ps_'+i).value);products[i].stock.M=parseInt(document.getElementById('pm_'+i).value);products[i].stock.L=parseInt(document.getElementById('pl_'+i).value);products[i].stock.XL=parseInt(document.getElementById('pxl_'+i).value);document.getElementById('status').innerText='✅ '+products[i].name+' saved';}

  let nama_seabank=document.getElementById('nama_seabank').value;

  let html=`<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GREGARIOUS CLUB</title><script src="https://cdn.tailwindcss.com"><\/script><link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;700;900&family=Bebas+Neue&display=swap" rel="stylesheet"><style>.serif{font-family:'Instrument Serif',serif}.bebas{font-family:'Bebas Neue',sans-serif}.grgs{font-family:'Inter',sans-serif;font-weight:900}.logo-oval{border:2.5px solid currentColor;border-radius:50%;padding:7px 24px;display:inline-block}.marquee{animation:marquee 25s linear infinite;display:inline-flex;white-space:nowrap}@keyframes marquee{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}.size-btn.active{background:black;color:white}.payment-method.active{border-color:black;background:#f5f5f5}.pulse{animation:pulse 1.5s infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.6}}.progress-bar{transition:width 1s ease-out}<\/style></head><body class="bg-white text-black">
<script>const NO_WA="${wa}";const REK_BRI="${rek_bri}";const NAMA_BRI="${nama_bri}";const REK_SEABANK="${rek_seabank}";const NAMA_SEABANK="${nama_seabank}";const PRODUCTS=${JSON.stringify(productsObj)};const ONGKIR=${JSON.stringify(ongkir)};<\/script>

<header class="sticky top-0 z-40 bg-white/95 backdrop-blur border-b flex justify-between items-center px-6 py-4"><button onclick="document.getElementById('menu').classList.remove('hidden')">☰</button><div class="logo-oval grgs">GRGS</div><button onclick="document.getElementById('cart').classList.remove('hidden')" class="border border-black px-5 py-2 rounded-full text-[11px] font-bold">CART <span id="cartCount">0</span></button></header>

E PEMBAYARAN →</button></div></div>

<div id="successModal" class="fixed inset-0 z-[130] hidden bg-white"><div class="max-w-[460px] mx-auto min-h-screen p-6 flex flex-col items-center justify-center text-center"><div class="w-20 h-20 bg-green-500 rounded-full flex items-center justify-center text-[32px] text-white">✓</div><h2 class="bebas text-[36px] mt-6">PEMBAYARAN<br>TERKIRIM!</h2><p class="text-[12px] mt-3 opacity-60">Bukti pembayaran sudah dikirim ke admin via WA.</p><div id="successDetails" class="bg-gray-100 p-4 rounded-[12px] mt-6 text-[11px] w-full text-left"></div><button onclick="location.reload()" class="w-full bg-black text-white py-4 rounded-full mt-8 text-[11px] font-bold">KEMBALI KE TOKO</button><p class="text-[10px] opacity-40 mt-4">Order ID: <span id="successOrderId"></span></p></div></div>

<script>
let selected={},cart=[],selectedPayment='';const shipSel=document.getElementById('shipMethod');Object.entries(ONGKIR).forEach(([n,h])=>{let o=document.createElement('option');o.value=n;o.textContent=n+" - Rp "+h.toLocaleString('id-ID');shipSel.appendChild(o);});function getOngkir(){return ONGKIR[shipSel.value]||10000;}function selectPayment(m){selectedPayment=m;document.querySelectorAll('.payment-method').forEach(el=>{el.classList.remove('active');el.querySelector('.w-3').classList.add('hidden');});let el=document.getElementById('pay_'+m);el.classList.add('active');el.querySelector('.w-3').classList.remove('hidden');}
function getStockBadge(total,percent){if(total==0)return '<span class="bg-red-600 text-white text-[9px] px-3 py-1.5 rounded-full font-bold pulse">SOLD OUT</span>';if(percent>=90)return '<span class="bg-red-600 text-white text-[9px] px-3 py-1.5 rounded-full font-bold pulse">🔥 HAMPIR HABIS! '+percent+'% TERJUAL</span>';if(percent>=70)return '<span class="bg-orange-500 text-white text-[9px] px-3 py-1.5 rounded-full font-bold">⚡ TERJUAL '+percent+'%</span>';if(percent>=50)return '<span class="bg-yellow-500 text-black text-[9px] px-3 py-1.5 rounded-full font-bold">TERJUAL '+percent+'%</span>';return '<span class="bg-black text-white text-[9px] px-3 py-1.5 rounded-full font-bold">TERSEDIA</span>';}
function getSizeStockText(stock){return Object.entries(stock).filter(([s,q])=>q>0).map(([s,q])=>s+'('+q+')').join(' • ')||'HABIS';}
function renderProducts(){let g=document.getElementById('productGrid');g.innerHTML='';Object.keys(PRODUCTS).forEach(id=>{let p=PRODUCTS[id];let totalSisa=Object.values(p.stock).reduce((a,b)=>a+b,0);let totalAwal=p.initial||20;let terjual=p.sold||(totalAwal-totalSisa);let percent=Math.round((terjual/totalAwal)*100);if(percent>100)percent=100;if(percent<0)percent=0;let badge=getStockBadge(totalSisa,percent);let sizeInfo=getSizeStockText(p.stock);let barColor=percent>=90?'bg-red-600':(percent>=70?'bg-orange-500':'bg-black');g.innerHTML+='<div class="border rounded-[20px] overflow-hidden bg-white hover:shadow-lg transition"><div class="aspect-[4/5] bg-[#fafafa] relative flex items-center justify-center"><img src="'+p.img+'" onerror="this.src=\\'https://via.placeholder.com/400x500?text='+encodeURIComponent(p.name)+'\\'" class="w-full h-full object-contain p-8"><div class="absolute top-4 left-4">'+badge+'</div><div class="absolute top-4 right-4 bg-white/90 backdrop-blur px-2.5 py-1 rounded-full text-[9px] font-bold border">'+sizeInfo+'</div></div><div class="p-5"><h4 class="font-bold text-[13px]">'+p.name+'</h4><p class="font-black text-[14px] mt-1">Rp '+p.price.toLocaleString('id-ID')+'</p><div class="mt-3"><div class="flex justify-between text-[10px] mb-1"><span class="font-bold '+(percent>=90?'text-red-600':'')+'">'+(percent>=90?'🔥 TINGGAL '+totalSisa+' LAGI!':'Terjual '+terjual+' dari '+totalAwal)+'</span><span class="opacity-60">'+percent+'% terjual</span></div><div class="w-full bg-gray-200 rounded-full h-2 overflow-hidden"><div class="progress-bar '+barColor+' h-2 rounded-full" style="width:'+percent+'%"></div></div><p class="text-[9px] opacity-50 mt-1">📦 Sisa stok: '+sizeInfo+' • '+totalSisa+' pcs lagi!</p></div><div class="flex gap-2 mt-4" id="sizes-'+id+'"></div><button onclick="addToCart(\\''+id+'\\')" class="w-full mt-4 bg-black text-white py-3.5 rounded-full text-[11px] font-bold disabled:opacity-20" '+(totalSisa==0?'disabled':'')+'>'+(totalSisa==0?'SOLD OUT - RESTOCK SOON':'ADD TO CART')+'</button></div></div>';});renderSizes();}
function renderSizes(){Object.keys(PRODUCTS).forEach(id=>{let cont=document.getElementById('sizes-'+id);if(!cont)return;cont.innerHTML='';Object.keys(PRODUCTS[id].stock).forEach(s=>{let q=PRODUCTS[id].stock[s];let b=document.createElement('button');let label=q==0?s+' ✕':(q==1?s+' 🔥':s+' ('+q+')');b.textContent=label;b.className='size-btn border rounded-full px-3 h-10 text-[11px] font-bold '+(q==0?'opacity-20 line-through':'')+' '+(q==1?'border-red-500 text-red-600 animate-pulse':'');if(q==0)b.disabled=true;b.onclick=()=>{selected[id]=s;cont.querySelectorAll('button').forEach(x=>x.classList.remove('active'));b.classList.add('active');};cont.appendChild(b);});let first=Object.keys(PRODUCTS[id].stock).find(s=>PRODUCTS[id].stock[s]>0);if(first){selected[id]=first;setTimeout(()=>{cont.querySelectorAll('button').forEach(b=>{if(b.textContent.startsWith(first))b.click()})},100);}});}
function addToCart(id){let s=selected[id];if(!s)return alert('Pilih size!');if(PRODUCTS[id].stock[s]<=0)return alert('Habis!');let c=cart.filter(i=>i.id==id&&i.size==s).length;if(c>=PRODUCTS[id].stock[s])return alert('Stok cuma '+PRODUCTS[id].stock[s]);cart.push({id,size:s,price:PRODUCTS[id].price,name:PRODUCTS[id].name});PRODUCTS[id].stock[s]--;updateCart();document.getElementById('cart').classList.remove('hidden');renderProducts();}
function updateCart(){document.getElementById('cartCount').textContent=cart.length;document.getElementById('cartCountText').textContent=cart.length;let sub=cart.reduce((a,b)=>a+b.price,0),ong=cart.length>0?getOngkir():0,tot=sub+ong;document.getElementById('subtotalText').textContent='Rp '+sub.toLocaleString('id-ID');document.getElementById('ongkirText').textContent='Rp '+ong.toLocaleString('id-ID');document.getElementById('cartTotal').textContent='Rp '+tot.toLocaleString('id-ID');document.getElementById('cartItems').innerHTML=cart.length==0?'<p class="text-center py-16 opacity-30 text-[12px]">Kosong</p>':cart.map((it,idx)=>'<div class="flex justify-between py-3 border-b text-[12px]"><div><b>'+it.name+'</b><br><span class="text-[11px] opacity-60">Size '+it.size+'</span></div><div class="text-right">Rp '+it.price.toLocaleString('id-ID')+'<br><button onclick="removeItem('+idx+')" class="text-red-500 text-[10px]">HAPUS</button></div></div>').join('');document.getElementById('checkoutSummary').innerHTML=cart.map(i=>'• '+i.name+' '+i.size).join('<br>')+'<br><br>Subtotal Rp '+sub.toLocaleString('id-ID')+'<br>Ongkir '+shipSel.value+' Rp '+ong.toLocaleString('id-ID')+'<br><b>TOTAL Rp '+tot.toLocaleString('id-ID')+'</b>';}

border-black py-2 rounded-full mt-4 text-[11px] font-bold">📋 COPY NO REK SEABANK</button></div>';}startTimer();}
let timerInterval;function startTimer(){let sec=86400;clearInterval(timerInterval);timerInterval=setInterval(()=>{sec--;let h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=sec%60;document.getElementById('payTimer').textContent=String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');if(sec<=0){clearInterval(timerInterval);alert('Waktu habis');location.reload();}},1000);}
