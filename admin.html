<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GRGS ADMIN V13.3 SIMPLE</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-[#f5f5f5] p-3">
<div class="max-w-[800px] mx-auto">
<div class="bg-black text-white p-4 rounded-[16px] flex justify-between items-center"><h1 class="font-black text-[14px]">GRGS ADMIN V13.3 SIMPLE 🔥</h1><div class="flex gap-2"><button onclick="saveAll()" class="bg-white text-black px-4 py-2 rounded-full text-[11px] font-black">💾 SAVE</button><a href="/" class="border border-white px-4 py-2 rounded-full text-[11px]">TOKO</a></div></div>
<div class="bg-white p-4 rounded-[16px] border mt-4">
<h3 class="font-black text-[12px]">🎨 BERANDA (15 FIELD - LEBIH LENGKAP DARI V12.2)</h3>
<div class="grid grid-cols-2 gap-2 mt-3">
<input id="heroImg" value="hero.jpg" class="border-2 border-black rounded-full px-3 py-2 text-[11px]" placeholder="hero.jpg">
<input id="marquee" value="★★★★★ 4.9/5 (558+ ULASAN) • UNITED AS ONE • BANDUNG" class="border-2 border-black rounded-full px-3 py-2 text-[11px]" placeholder="marquee">
<input id="heroTitle1" value="UNITED" class="border-2 border-black rounded-full px-3 py-2 text-[12px] font-black">
<input id="heroTitle2" value="AS ONE" class="border-2 border-black rounded-full px-3 py-2 text-[12px] font-black">
<input id="heroSub" value="FOREVER YOUNG" class="border rounded-full px-3 py-2 text-[11px]">
<input id="heroButton" value="SHOP NOW →" class="border rounded-full px-3 py-2 text-[11px]">
</div>
<textarea id="heroDesc" class="w-full border rounded-[12px] px-3 py-2 text-[11px] mt-2 h-[40px]">Koleksi eksklusif stok terbatas.</textarea>
<div class="grid grid-cols-3 gap-2 mt-2">
<input id="stat1Num" value="1000+" class="border-2 border-black rounded-full px-2 py-2 text-[11px] font-black text-center"><input id="stat2Num" value="4.9/5" class="border-2 border-black rounded-full px-2 py-2 text-[11px] font-black text-center bg-[#FFD700]"><input id="stat3Num" value="500+" class="border-2 border-black rounded-full px-2 py-2 text-[11px] font-black text-center">
<input id="stat1Label" value="TERJUAL" class="border rounded-full px-2 py-1 text-[9px] text-center"><input id="stat2Label" value="RATING" class="border rounded-full px-2 py-1 text-[9px] text-center"><input id="stat3Label" value="CUSTOMER" class="border rounded-full px-2 py-1 text-[9px] text-center">
<input id="ratingAvg" value="4.9" class="border-2 border-black rounded-full px-2 py-2 text-[11px] text-center"><input id="totalUlasan" value="558" class="border-2 border-black rounded-full px-2 py-2 text-[11px] text-center"><input id="totalTerjual" value="500" class="border-2 border-black rounded-full px-2 py-2 text-[11px] text-center">
</div>
<input id="shopTitle" value="SHOP COLLECTION" class="w-full border-2 border-black rounded-full px-3 py-2 text-[11px] font-bold mt-2">
<input id="shopSub" value="⭐ 4.9/5 • 10 PRODUK • SLIDE DEPAN-BELAKANG" class="w-full border rounded-full px-3 py-1.5 text-[10px] mt-1">
<input id="aboutTitle" value="UNITED AS ONE" class="w-full border rounded-full px-3 py-2 text-[11px] font-bold mt-2">
<textarea id="aboutDesc" class="w-full border rounded-[12px] px-3 py-2 text-[11px] mt-1 h-[40px]">Brand lokal Bandung 40614. Forever young.</textarea>
</div>
<div class="bg-white p-4 rounded-[16px] border mt-4">
<h3 class="font-black text-[12px]">👕 PRODUK 10 - FILE ASLI (cross_black.jpg + richbefore_wp_front.jpg)</h3>
<div id="productList" class="mt-3 space-y-3"></div>
<button onclick="addProduct()" class="w-full border-2 border-dashed border-black py-3 rounded-full text-[11px] font-bold mt-3">+ TAMBAH PRODUK</button>
</div>
<div class="bg-white p-4 rounded-[16px] border mt-4">
<h3 class="font-black text-[12px]">💳 BAYAR & ONGKIR</h3>
<div class="grid grid-cols-2 gap-2 mt-3">
<input id="bri" value="074901024253504" class="border-2 border-black rounded-full px-3 py-2 text-[11px] font-mono"><input id="namaBri" value="RIZAL FARUK HAYDAR" class="border rounded-full px-3 py-2 text-[10px]">
<input id="seabank" value="901100694312" class="border-2 border-black rounded-full px-3 py-2 text-[11px] font-mono"><input id="namaSeabank" value="RIZAL FARUK HAYDAR" class="border rounded-full px-3 py-2 text-[10px]">
<input id="wa" value="0881023595180" class="border-2 border-black rounded-full px-3 py-2 text-[11px] font-bold"><input id="ongkir" value="10000,13000,18000" class="border rounded-full px-3 py-2 text-[11px]" placeholder="10000,13000,18000">
</div>
</div>
<div class="bg-black text-white p-4 rounded-[16px] mt-4 text-center"><p id="status" class="text-[11px] opacity-60">Simple kayak V12.2 tapi lebih lengkap! 15 field beranda + 10 produk + rating + file asli</p><button onclick="exportIndex()" class="w-full bg-white text-black py-3 rounded-full font-black text-[12px] mt-3">⬇️ EXPORT INDEX.HTML V19</button></div>
</div>
<script>
let defaults=[
{id:"CROSS_BLACK",n:"CROSS TSHIRT - BLACK",p:145000,i:["cross_black.jpg"],s:{S:2,M:3,L:2,XL:1},sold:120,init:150,r:4.9},
{id:"CROSS_WHITE",n:"CROSS TSHIRT - WHITE",p:145000,i:["cross_white.jpg"],s:{S:2,M:3,L:2,XL:1},sold:98,init:120,r:4.8},
{id:"BABY_BLACK",n:"BABYTEE - BLACK",p:135000,i:["babytee_black.jpg"],s:{S:5,M:5,L:5,XL:2},sold:75,init:100,r:4.9},
{id:"BABY_WHITE",n:"BABYTEE - WHITE",p:135000,i:["babytee_white.jpg"],s:{S:5,M:5,L:5,XL:2},sold:68,init:100,r:4.9},
{id:"RICH_WP_NEW",n:"RICH BEFORE - WHITE PINK (NEW)",p:155000,i:["richbefore_wp_front.jpg","richbefore_wp_back.jpg"],s:{S:5,M:5,L:5,XL:5},sold:12,init:50,r:5.0},
{id:"RICH_WG",n:"RICH BEFORE - WHITE GREY",p:155000,i:["richbefore_wg_front.jpg","richbefore_wg_back.jpg"],s:{S:0,M:0,L:0,XL:0},sold:50,init:50,r:4.9},
{id:"RICH_BG",n:"RICH BEFORE - BLACK GREY",p:155000,i:["richbefore_bg_front.jpg","richbefore_bg_back.jpg"],s:{S:2,M:3,L:2,XL:1},sold:45,init:50,r:4.8},
{id:"RICH_BP",n:"RICH BEFORE - BLACK PINK",p:155000,i:["richbefore_bp_front.jpg","richbefore_bp_back.jpg"],s:{S:0,M:0,L:0,XL:0},sold:50,init:50,r:4.9},
{id:"RICH_WP_OLD",n:"RICH BEFORE - WHITE PINK",p:155000,i:["richbefore_wp_front.jpg","richbefore_wp_back.jpg"],s:{S:0,M:0,L:0,XL:0},sold:50,init:50,r:4.9},
{id:"FL_WHITE",n:"FUCKLOVE - WHITE",p:145000,i:["fucklove_white_front.jpg"],s:{S:3,M:3,L:3,XL:2},sold:40,init:60,r:4.9}
];
let products=JSON.parse(localStorage.getItem('GRGS_P')||JSON.stringify(defaults));
function render(){let el=document.getElementById('productList');el.innerHTML='';products.forEach((x,i)=>{el.innerHTML+=`<div class="border-2 rounded-[12px] p-3"><div class="flex justify-between"><input id="id_${i}" value="${x.id}" class="text-[10px] font-mono border px-2 py-1 rounded w-[100px]"><span class="text-[9px] bg-black text-white px-2 py-1 rounded-full">${Object.values(x.s).reduce((a,b)=>a+b,0)} SISA • ★${x.r}</span><button onclick="products.splice(${i},1);save()" class="text-red-500 text-[10px]">HAPUS</button></div><input id="n_${i}" value="${x.n}" class="w-full border-2 border-black rounded-full px-3 py-2 mt-2 text-[11px] font-bold"><div class="grid grid-cols-4 gap-1 mt-2"><input id="p_${i}" type="number" value="${x.p}" class="border-2 rounded-full px-2 py-1 text-[10px]"><input id="sold_${i}" type="number" value="${x.sold}" class="border rounded-full px-2 py-1 text-[10px]"><input id="init_${i}" type="number" value="${x.init}" class="border rounded-full px-2 py-1 text-[10px]"><input id="r_${i}" type="number" step="0.1" value="${x.r}" class="border rounded-full px-2 py-1 text-[10px] bg-yellow-200"></div><input id="img_${i}" value="${x.i.join(',')}" class="w-full border rounded-full px-2 py-1 text-[10px] mt-1"><div class="grid grid-cols-4 gap-1 mt-1"><input id="s_${i}" type="number" value="${x.s.S}" class="border rounded-full py-1 text-center text-[11px]"><input id="m_${i}" type="number" value="${x.s.M}" class="border rounded-full py-1 text-center text-[11px]"><input id="l_${i}" type="number" value="${x.s.L}" class="border rounded-full py-1 text-center text-[11px]"><input id="xl_${i}" type="number" value="${x.s.XL}" class="border rounded-full py-1 text-center text-[11px]"></div></div>`;});}
function save(){products.forEach((_,i)=>{let d=document.getElementById('id_'+i);if(!d)return;products[i].id=d.value;products[i].n=document.getElementById('n_'+i).value;products[i].p=parseInt(document.getElementById('p_'+i).value);products[i].sold=parseInt(document.getElementById('sold_'+i).value);products[i].init=parseInt(document.getElementById('init_'+i).value);products[i].r=parseFloat(document.getElementById('r_'+i).value);products[i].i=document.getElementById('img_'+i).value.split(',').map(s=>s.trim());products[i].s.S=parseInt(document.getElementById('s_'+i).value);products[i].s.M=parseInt(document.getElementById('m_'+i).value);products[i].s.L=parseInt(document.getElementById('l_'+i).value);products[i].s.XL=parseInt(document.getElementById('xl_'+i).value);});localStorage.setItem('GRGS_P',JSON.stringify(products));let cfg={heroImg:heroImg.value,marquee:marquee.value,heroTitle1:heroTitle1.value,heroTitle2:heroTitle2.value,heroSub:heroSub.value,heroDesc:heroDesc.value,heroButton:heroButton.value,stat1Num:stat1Num.value,stat1Label:stat1Label.value,stat2Num:stat2Num.value,stat2Label:stat2Label.value,stat3Num:stat3Num.value,stat3Label:stat3Label.value,ratingAvg:ratingAvg.value,totalUlasan:totalUlasan.value,totalTerjual:totalTerjual.value,shopTitle:shopTitle.value,shopSub:shopSub.value,aboutTitle:aboutTitle.value,aboutDesc:aboutDesc.value,bri:bri.value,namaBri:namaBri.value,seabank:seabank.value,namaSeabank:namaSeabank.value,wa:wa.value,ongkir:ongkir.value};localStorage.setItem('GRGS_CFG',JSON.stringify(cfg));document.getElementById('status').innerText='✅ SAVE BERHASIL! '+products.length+' produk';render();}
function saveAll(){save();}
function addProduct(){products.push({id:"NEW_"+Date.now(),n:"PRODUK BARU",p:145000,i:["cross_black.jpg"],s:{S:5,M:5,L:5,XL:5},sold:0,init:50,r:5.0});save();}
function exportIndex(){save();let cfg=JSON.parse(localStorage.getItem('GRGS_CFG'));alert('SAVE OK! CFG: '+cfg.heroTitle1+' '+cfg.heroTitle2+' | Produk: '+products.length+' | File asli: cross_black.jpg + richbefore_wp_front.jpg | Rating ★'+cfg.ratingAvg+' | Ulasan '+cfg.totalUlasan+'+ | WA '+cfg.wa);}
render();
</script>
</body></html>
