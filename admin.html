<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GRGS ADMIN V42 FIX ALL</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-[#f5f5f0] text-black p-3 pb-20">
<div id="login" class="fixed inset-0 bg-black flex items-center justify-center z-[100]"><div class="bg-white p-8 rounded-[24px] border-2 border-black text-center"><h1 class="font-black">ADMIN V42 FIX</h1><input id="pass" type="password" placeholder="GRGSADMIN123" class="w-full border-2 border-black rounded-full px-5 py-3 mt-4 text-center"><button onclick="if(pass.value==='GRGSADMIN123'){login.classList.add('hidden');initAdmin();}else alert('Salah')" class="w-full bg-black text-white py-3 rounded-full font-black mt-3">MASUK</button></div></div>
<div class="flex justify-between"><h1 class="font-black text-[13px]">ADMIN V42 - f8e36b76daf1d55776f9 - AUTO REFRESH 3 DETIK</h1><button onclick="loadOrders()" class="bg-green-600 text-white px-4 py-2 rounded-full text-[11px] font-black">🔄 REFRESH ORDER SEKARANG</button></div>
<div class="bg-white border-2 border-black rounded-[16px] p-4 mt-3 flex justify-between"><button onclick="cloudSaveAdmin()" class="bg-black text-white px-4 py-2 rounded-full text-[11px]">☁️ SYNC</button><p id="cloudStatus" class="text-[10px] font-bold bg-[#FFD700] px-3 py-1 rounded-full border-2 border-black">Ready</p></div>
<div id="orderList" class="mt-5 space-y-4"></div>
<script>
const CLOUD_ID="f8e36b76daf1d55776f9";const CLOUD_URL="https://api.npoint.io/"+CLOUD_ID;
let cfg={wa:"0881023595180",bri:"074901024253504",seabank:"901100694312"};
try{let c=localStorage.getItem('GRGS_CFG');if(c)cfg=Object.assign(cfg,JSON.parse(c));}catch(e){}
async function cloudSaveAdmin(){try{let o=JSON.parse(localStorage.getItem('GRGS_ORDERS')||'[]');let p=JSON.parse(localStorage.getItem('GRGS_P')||'null');let d={products:p||[],cfg:cfg,orders:o,updated:Date.now()};await fetch(CLOUD_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});cloudStatus.innerText='SYNC OK '+new Date().toLocaleTimeString()+' - '+o.length+' orders';}catch(e){}}
async function loadOrders(){try{let r=await fetch(CLOUD_URL+'?t='+Date.now(),{cache:'no-store'});let d=await r.json();if(d.orders){localStorage.setItem('GRGS_ORDERS',JSON.stringify(d.orders));}if(d.cfg){cfg=Object.assign(cfg,d.cfg);localStorage.setItem('GRGS_CFG',JSON.stringify(cfg));}renderOrders();cloudStatus.innerText='LOAD OK '+new Date().toLocaleTimeString()+' - '+(d.orders?d.orders.length:0)+' orders - KLIK REFRESH LAGI KALO BELUM MUNCUL';}catch(e){cloudStatus.innerText='LOAD GAGAL';}}
function initAdmin(){renderOrders();loadOrders();setInterval(loadOrders,3000);}
function normWA(n){let d=(n+'').replace(/[^0-9]/g,'');if(d.startsWith('0'))return'62'+d.slice(1);return d;}
function renderOrders(){let orders=JSON.parse(localStorage.getItem('GRGS_ORDERS')||'[]');let list=document.getElementById('orderList');if(orders.length==0){list.innerHTML='<p class="text-center py-10 opacity-50">Belum ada order - auto refresh 3 detik - coba klik REFRESH ORDER SEKARANG di atas</p>';return;}list.innerHTML='';orders.slice().reverse().forEach(function(o){list.innerHTML+='<div class="bg-white border-2 border-black rounded-[16px] p-4"><div class="flex justify-between"><span class="font-black text-[11px] bg-black text-white px-3 py-1 rounded-full">'+o.orderId+'</span><span class="bg-[#FFD700] px-3 py-1 rounded-full text-[10px] font-black border-2 border-black">'+o.status+'</span></div><p class="text-[11px] mt-2 font-bold">👤 '+o.name+' • '+o.wa+'</p><p class="text-[10px] mt-1">Alamat: '+o.addr+'</p><div class="bg-[#fafaf9] border rounded-[12px] p-2 mt-2 text-[10px]">'+(o.items||[]).map(c=>c.n+' Size '+c.s+' Rp '+(c.p||0).toLocaleString('id-ID')).join('<br>')+'</div><div class="bg-black text-white p-3 rounded-[12px] mt-2"><p class="text-[11px] font-black">TOTAL WAJIB Rp '+(o.total||0).toLocaleString('id-ID')+' • Kode '+o.uniqueCode+'</p><p class="text-[9px]">'+o.ongkirName+' • '+o.dateStr+'</p></div>'+(o.bukti?'<p class="text-[10px] font-bold mt-3">BUKTI TF:</p><img src="'+o.bukti+'" class="w-full h-[350px] object-contain rounded-[12px] mt-2 border-2 border-black bg-[#f5f5f0]">':'<p class="text-red-600 font-bold">TIDAK ADA BUKTI!</p>')+'<div class="grid grid-cols-2 gap-3 mt-4"><button onclick="verifyOrder(\''+o.orderId+'\')" class="bg-green-600 text-white py-3 rounded-full text-[11px] font-black">✅ VERIFIKASI + WA PEMBELI</button><button onclick="rejectOrder(\''+o.orderId+'\')" class="bg-red-600 text-white py-3 rounded-full text-[11px] font-black">❌ TOLAK + WA PEMBELI</button></div></div>';});}
function verifyOrder(id){let orders=JSON.parse(localStorage.getItem('GRGS_ORDERS')||'[]');let idx=orders.findIndex(x=>x.orderId==id);if(idx==-1)return;orders[idx].status='TERVERIFIKASI';localStorage.setItem('GRGS_ORDERS',JSON.stringify(orders));cloudSaveAdmin();renderOrders();let o=orders[idx];let wa=normWA(o.wa);let msg='Halo '+o.name+'! 🙏%0APesanan '+o.orderId+' di GREGARIOUS CLUB TERVERIFIKASI ✅%0A%0ADetail:%0A'+(o.items||[]).map(c=> '• '+c.n+' Size '+c.s).join('%0A')+'%0A%0ATotal Rp '+o.total.toLocaleString('id-ID')+'%0AAlamat: '+o.addr+'%0A%0ASegera kami kirim! Terima kasih!';window.open('https://wa.me/'+wa+'?text='+msg,'_blank');}
function rejectOrder(id){let orders=JSON.parse(localStorage.getItem('GRGS_ORDERS')||'[]');let idx=orders.findIndex(x=>x.orderId==id);if(idx==-1)return;orders[idx].status='DITOLAK';localStorage.setItem('GRGS_ORDERS',JSON.stringify(orders));cloudSaveAdmin();renderOrders();let o=orders[idx];let wa=normWA(o.wa);let msg='Halo '+o.name+'%0APesanan '+o.orderId+' DITOLAK ❌%0ATotal harus Rp '+o.total.toLocaleString('id-ID')+' PAS (kode '+o.uniqueCode+')%0ASilakan TF ulang ke BRI '+cfg.bri+' / SeaBank '+cfg.seabank;window.open('https://wa.me/'+wa+'?text='+msg,'_blank');}
</script></body></html>
