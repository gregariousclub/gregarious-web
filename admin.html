<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GRGS ADMIN V38 SECURE</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-[#f5f5f0] text-black p-3">
<div id="login" class="fixed inset-0 bg-black flex items-center justify-center z-[100]"><div class="bg-white p-8 rounded-[24px] border-2 border-black text-center max-w-[420px]"><h1 class="font-black text-[22px]">GRGS ADMIN V38 SECURE</h1><p class="text-[11px] mt-2">ANTI NIPU - Cloud f8e36b76daf1d55776f9</p><input id="pass" type="password" placeholder="GRGSADMIN123" class="w-full border-2 border-black rounded-full px-5 py-3 mt-4 text-center"><button onclick="if(pass.value==='GRGSADMIN123'){login.classList.add('hidden');initAdminV38();}else alert('Salah!')" class="w-full bg-black text-white py-3 rounded-full font-black mt-3">MASUK</button></div></div>
<div class="flex justify-between items-center flex-wrap gap-2"><h1 class="font-black text-[18px]">GRGS ADMIN V38 SECURE f8e36b76daf1d55776f9</h1><div class="flex gap-2"><button onclick="resetToDefaultAndSync()" class="bg-red-600 text-white px-4 py-2 rounded-full text-[11px] font-black">🔄 RESET</button><span class="bg-green-600 text-white border-2 border-black px-3 py-2 rounded-full text-[10px] font-black">🔒 SECURE</span></div></div>
<div class="bg-[#FFD700] border-2 border-black rounded-[16px] p-4 mt-3"><p class="font-black text-[12px]">🔒 ANTI NIPU V38 - WAJIB BUKTI + KODE UNIK!</p><div class="flex gap-2 mt-2"><button onclick="cloudSaveAdmin()" class="bg-black text-white px-4 py-2 rounded-full text-[11px] font-black">☁️ SYNC TO CLOUD</button><button onclick="cloudLoadAdmin()" class="bg-white border-2 border-black px-4 py-2 rounded-full text-[11px] font-black">☁️ LOAD FROM CLOUD</button></div><p id="cloudStatus" class="text-[10px] mt-2 font-bold bg-white px-2 py-1 rounded-full border">Status: V38 SECURE</p></div>
<div class="bg-white border-2 border-black rounded-[20px] p-5 mt-4"><h3 class="font-black text-[15px]">PRODUK 10 - SAVE ALL (NO AUTO RESET)</h3><div id="productListAdmin" class="grid md:grid-cols-2 gap-4 mt-4"></div><button onclick="saveAllV38()" class="w-full bg-[#FFD700] border-2 border-black py-4 rounded-full font-black mt-6">💾 SAVE ALL + SYNC CLOUD</button></div>
<div class="bg-black text-white border-2 border-[#FFD700] rounded-[16px] p-4 mt-4"><div class="flex justify-between"><h3 class="font-black text-[#FFD700] text-[13px]">🔒 KONFIRMASI SECURE - CEK BUKTI + MUTASI + KODE UNIK!</h3><button onclick="clearOrders()" class="bg-red-600 text-white px-3 py-1 rounded-full text-[10px] font-black">HAPUS SEMUA</button></div><p id="orderNotif" class="text-[11px] mt-2 text-[#FFD700]">Menunggu order</p><div id="orderList" class="mt-4 space-y-4"></div></div>
<script>
const CLOUD_ID="f8e36b76daf1d55776f9";const CLOUD_URL="https://api.npoint.io/"+CLOUD_ID;
let DEFAULTS=[{id:"CROSS_BLACK",n:"CROSS TSHIRT - BLACK",p:145000,i:["cross_black.jpg"],s:{S:2,M:3,L:2,XL:1},sold:120,r:4.9},{id:"CROSS_WHITE",n:"CROSS TSHIRT - WHITE",p:145000,i:["cross_white.jpg"],s:{S:2,M:3,L:2,XL:1},sold:98,r:4.8},{id:"BABY_BLACK",n:"BABYTEE - BLACK",p:135000,i:["babytee_black.jpg"],s:{S:5,M:5,L:5,XL:2},sold:75,r:4.9},{id:"BABY_WHITE",n:"BABYTEE - WHITE",p:135000,i:["babytee_white.jpg"],s:{S:5,M:5,L:5,XL:2},sold:68,r:4.9},{id:"RICH_WP_NEW",n:"RICH BEFORE - WHITE PINK (NEW)",p:155000,i:["richbefore_wp_front.jpg"],s:{S:5,M:5,L:5,XL:5},sold:12,r:5.0},{id:"RICH_WG",n:"RICH BEFORE - WHITE GREY",p:155000,i:["richbefore_wg_front.jpg"],s:{S:0,M:0,L:0,XL:0},sold:50,r:4.9},{id:"RICH_BG",n:"RICH BEFORE - BLACK GREY",p:155000,i:["richbefore_bg_front.jpg"],s:{S:2,M:3,L:2,XL:1},sold:45,r:4.8},{id:"RICH_BP",n:"RICH BEFORE - BLACK PINK",p:155000,i:["richbefore_bp_front.jpg"],s:{S:0,M:0,L:0,XL:0},sold:50,r:4.9},{id:"RICH_WP_OLD",n:"RICH BEFORE - WHITE PINK",p:155000,i:["richbefore_wp_front.jpg"],s:{S:0,M:0,L:0,XL:0},sold:50,r:4.9},{id:"FL_WHITE",n:"FUCKLOVE - WHITE",p:145000,i:["fucklove_white_front.jpg"],s:{S:3,M:3,L:3,XL:2},sold:40,r:4.9}];
let DEF_CFG={headerLogo:"GRGS",heroLogo:"GRGS",brand:"GREGARIOUS CLUB",tagline:"We're not just a brand. We're a community.",heroImg:"hero.jpg",marquee:"★★★★★ 4.9/5 (558+ ULASAN) • UNITED AS ONE • BANDUNG 40614 • SECURE •",heroTitle1:"UNITED",heroTitle2:"AS ONE",heroButton:"SHOP NOW",shopTitle:"SHOP COLLECTION",shopSub:"10 PRODUK SECURE",ratingAvg:"4.9",totalUlasan:"558",totalTerjual:"500",wa:"0881023595180",bri:"074901024253504",seabank:"901100694312"};
let DEF_ONGKIR=[{n:"BANDUNG - JNE OKE",p:10000},{n:"JABODETABEK - JNE REG",p:13000}];
let DEF_ULASAN=[{name:"Andi • Bandung",text:"Kualitas mantep!",star:5}];
let products=JSON.parse(JSON.stringify(DEFAULTS));let cfg=Object.assign({},DEF_CFG);let ongkir=JSON.parse(JSON.stringify(DEF_ONGKIR));let ulasan=JSON.parse(JSON.stringify(DEF_ULASAN));
try{let p=localStorage.getItem('GRGS_P');if(p){let pr=JSON.parse(p);if(pr.length>=3)products=pr;}}catch(e){}
function resetToDefaultAndSync(){if(!confirm('RESET?'))return;products=JSON.parse(JSON.stringify(DEFAULTS));localStorage.setItem('GRGS_P',JSON.stringify(products));renderAdminV38();cloudSaveAdmin();}
async function cloudSaveAdmin(){try{let d={products:products,cfg:cfg,ongkir:ongkir,ulasan:ulasan,orders:JSON.parse(localStorage.getItem('GRGS_ORDERS')||'[]'),updated:Date.now()};await fetch(CLOUD_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});cloudStatus.innerText='☁️ SYNC OK '+new Date().toLocaleTimeString();}catch(e){cloudStatus.innerText='❌ Gagal';}}
async function cloudLoadAdmin(){try{let r=await fetch(CLOUD_URL);let d=await r.json();if(d.products&&d.products.length>=3){products=d.products;localStorage.setItem('GRGS_P',JSON.stringify(products));}if(d.cfg){cfg=Object.assign({},DEF_CFG,d.cfg);}cloudStatus.innerText='☁️ LOAD OK';renderAdminV38();renderOrders();}catch(e){}}
function initAdminV38(){renderAdminV38();renderOrders();}
function renderAdminV38(){let pl=document.getElementById('productListAdmin');pl.innerHTML='';products.forEach(function(p,i){pl.innerHTML+='<div class="border-2 border-black rounded-[16px] p-3 bg-[#f5f5f0]"><p class="font-black text-[11px]">'+p.n+'</p><div class="grid grid-cols-4 gap-2 mt-2"><div>S:<input id="s_'+i+'_S" value="'+p.s.S+'" class="border rounded px-1 w-[35px]"></div><div>M:<input id="s_'+i+'_M" value="'+p.s.M+'" class="border rounded px-1 w-[35px]"></div><div>L:<input id="s_'+i+'_L" value="'+p.s.L+'" class="border rounded px-1 w-[35px]"></div><div>XL:<input id="s_'+i+'_XL" value="'+p.s.XL+'" class="border rounded px-1 w-[35px]"></div></div><input id="name_'+i+'" value="'+p.n+'" class="w-full border-2 border-black rounded-full px-3 py-1 text-[11px] font-bold mt-2"></div>';});}
function saveAllV38(){products.forEach(function(p,i){try{p.n=document.getElementById('name_'+i).value||p.n;p.s.S=parseInt(document.getElementById('s_'+i+'_S').value)||0;p.s.M=parseInt(document.getElementById('s_'+i+'_M').value)||0;p.s.L=parseInt(document.getElementById('s_'+i+'_L').value)||0;p.s.XL=parseInt(document.getElementById('s_'+i+'_XL').value)||0;}catch(e){}});localStorage.setItem('GRGS_P',JSON.stringify(products));cloudSaveAdmin();alert('SAVE BERHASIL '+products.length+' produk!');}
function renderOrders(){let orders=JSON.parse(localStorage.getItem('GRGS_ORDERS')||'[]');let list=document.getElementById('orderList');let notif=document.getElementById('orderNotif');if(orders.length===0){list.innerHTML='<p class="text-[11px] opacity-60">Belum ada order</p>';return;}notif.innerText=orders.length+' ORDER - CEK BUKTI + MUTASI!';list.innerHTML='';orders.slice().reverse().forEach(function(o,i){let idx=orders.length-1-i;list.innerHTML+='<div class="bg-white text-black rounded-[16px] p-4 border-2 border-black"><div class="flex justify-between"><span class="font-black text-[11px]">'+o.orderId+'</span><span class="bg-[#FFD700] text-black px-3 py-1 rounded-full text-[9px] font-black">'+o.status+'</span></div><p class="text-[10px] mt-2"><b>'+o.name+'</b> - '+o.wa+'</p><div class="bg-black text-white p-3 rounded-[12px] mt-2"><p class="text-[12px] font-black">TOTAL WAJIB CEK: Rp '+(o.total||0).toLocaleString('id-ID')+' (Kode unik Rp '+(o.uniqueCode||0)+')</p></div>'+(o.bukti?'<img src="'+o.bukti+'" class="w-full h-[260px] object-contain rounded-[12px] mt-2 border-2 border-black bg-[#f5f5f0]">':'<p class="text-red-600">TIDAK ADA BUKTI!</p>')+'<div class="grid grid-cols-2 gap-2 mt-3"><button onclick="let a=JSON.parse(localStorage.getItem(\'GRGS_ORDERS\')||\'[]\');a['+idx+'].status=\'TERVERIFIKASI\';localStorage.setItem(\'GRGS_ORDERS\',JSON.stringify(a));cloudSaveAdmin();renderOrders()" class="bg-green-600 text-white py-3 rounded-full text-[11px] font-black">✅ VERIFIKASI</button><button onclick="let a=JSON.parse(localStorage.getItem(\'GRGS_ORDERS\')||\'[]\');a['+idx+'].status=\'DITOLAK_BUKTI_PALSU\';localStorage.setItem(\'GRGS_ORDERS\',JSON.stringify(a));cloudSaveAdmin();renderOrders()" class="bg-red-600 text-white py-3 rounded-full text-[11px] font-black">❌ TOLAK</button></div></div>';});}
function clearOrders(){if(confirm('Hapus semua?')){localStorage.setItem('GRGS_ORDERS','[]');renderOrders();cloudSaveAdmin();}}
</script></body></html>
