<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GREGARIOUS CLUB - UNITED AS ONE</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Instrument+Serif&display=swap" rel="stylesheet"><style>.bebas{font-family:'Bebas Neue'}.serif{font-family:'Instrument Serif'}.size-btn.active{background:#000;color:#fff}.slide-track{transition:transform.4s ease}</style></head><body class="bg-white text-black">
<script>
const PRODUCTS={
CROSS_BLACK:{name:"CROSS TSHIRT - BLACK",price:145000,imgs:["cross_black.jpg"],stock:{S:2,M:3,L:2,XL:1},sold:120,init:150},
CROSS_WHITE:{name:"CROSS TSHIRT - WHITE",price:145000,imgs:["cross_white.jpg"],stock:{S:2,M:3,L:2,XL:1},sold:98,init:120},
BABY_BLACK:{name:"BABYTEE - BLACK",price:135000,imgs:["babytee_black.jpg"],stock:{S:5,M:5,L:5,XL:2},sold:75,init:100},
BABY_WHITE:{name:"BABYTEE - WHITE",price:135000,imgs:["babytee_white.jpg"],stock:{S:5,M:5,L:5,XL:2},sold:68,init:100},
RICH_WP_NEW:{name:"RICH BEFORE TSHIRT - WHITE PINK (NEW)",price:155000,imgs:["richbefore_wp_front.jpg","richbefore_wp_back.jpg"],stock:{S:5,M:5,L:5,XL:5},sold:12,init:50},
RICH_WG:{name:"RICH BEFORE TSHIRT - WHITE GREY",price:155000,imgs:["richbefore_wg_front.jpg","richbefore_wg_back.jpg"],stock:{S:0,M:0,L:0,XL:0},sold:50,init:50},
RICH_BG:{name:"RICH BEFORE TSHIRT - BLACK GREY",price:155000,imgs:["richbefore_bg_front.jpg","richbefore_bg_back.jpg"],stock:{S:2,M:3,L:2,XL:1},sold:45,init:50},
RICH_BP:{name:"RICH BEFORE TSHIRT - BLACK PINK",price:155000,imgs:["richbefore_bp_front.jpg","richbefore_bp_back.jpg"],stock:{S:0,M:0,L:0,XL:0},sold:50,init:50},
RICH_WP_OLD:{name:"RICH BEFORE TSHIRT - WHITE PINK",price:155000,imgs:["richbefore_wp_front.jpg","richbefore_wp_back.jpg"],stock:{S:0,M:0,L:0,XL:0},sold:50,init:50},
FL_WHITE:{name:"FUCKLOVE TSHIRT - WHITE",price:145000,imgs:["fucklove_white_front.jpg"],stock:{S:3,M:3,L:3,XL:2},sold:40,init:60}
};
</script>
<div class="bg-black text-white py-2 text-center text-[10px] tracking-[0.3em]">UNITED AS ONE • BANDUNG • GRGS • 4.9/5 (558+ TERJUAL)</div>
<header class="sticky top-0 bg-white/95 backdrop-blur border-b flex justify-between items-center px-6 py-4 z-40"><div class="border-2 border-black rounded-full px-5 py-1 font-black text-sm">GRGS</div><button onclick="document.getElementById('cart').classList.remove('hidden')" class="border border-black px-5 py-2 rounded-full text-[11px] font-bold">CART (<span id="cartCount">0</span>)</button></header>
<section class="relative h-[70vh] bg-black text-white flex items-center justify-center text-center"><img src="hero.jpg" class="absolute inset-0 w-full h-full object-cover opacity-80" onerror="this.style.display='none'"><div class="absolute inset-0 bg-black/40"></div><div class="relative z-10"><h1 class="serif text-[56px] leading-[0.9]">UNITED<br>AS ONE</h1><a href="#shop" class="mt-8 inline-block bg-white text-black px-10 py-3 rounded-full text-xs font-bold">SHOP NOW</a></div></section>
<section id="shop" class="max-w-[1300px] mx-auto px-4 py-10"><h2 class="bebas text-[42px] text-center">SHOP COLLECTION</h2><p class="text-[11px] text-center opacity-60">10 PRODUK • SESUAI FILE GITHUB ASLI • SLIDE OTOMATIS</p><div id="productGrid" class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-8"></div></section>
<div id="cart" class="fixed inset-0 z-[100] hidden"><div class="absolute inset-0 bg-black/60" onclick="document.getElementById('cart').classList.add('hidden')"></div><div class="absolute right-0 top-0 h-full w-[92%] md:w-[420px] bg-white p-6 flex flex-col"><div class="flex justify-between"><h3 class="bebas text-2xl">CART (<span id="cartCountText">0</span>)</h3><button onclick="document.getElementById('cart').classList.add('hidden')">✕</button></div><div id="cartItems" class="flex-1 overflow-auto border-t mt-4 py-4 text-xs"></div><div class="border-t pt-4"><div class="flex justify-between font-bold"><span>TOTAL</span><span id="cartTotal">Rp 0</span></div><button onclick="alert('Checkout WA 0881023595180 - BRI 074901024253504 / SEABANK 901100694312')" class="w-full bg-black text-white py-4 rounded-full mt-4 text-xs font-bold">CHECKOUT →</button></div></div></div>
<script>
let sel={},cart=[],cur={};
function render(){
let g=document.getElementById('productGrid');g.innerHTML='';
Object.keys(PRODUCTS).forEach(id=>{
let p=PRODUCTS[id];let sisa=Object.values(p.stock).reduce((a,b)=>a+b,0);let isHabis=sisa==0;
let badge=isHabis?'🔥 HABIS 100%':Math.round(p.sold/p.init*100)+'% TERJUAL';
let sisaText=isHabis?'HABIS':(sisa<=3?'⚠️ SISA '+sisa+' LAGI!':'Sisa '+sisa);
cur[id]=0;
let imgsHtml=p.imgs.map(src=>`<img src="${src}" class="w-full h-full object-contain p-8 bg-[#fafafa] flex-shrink-0" style="min-width:100%" onerror="this.style.opacity='0.2'">`).join('');
let hasSlide=p.imgs.length>1;
let controls=hasSlide?`<button onclick="prevSlide('${id}')" class="absolute left-2 top-1/2 -translate-y-1/2 bg-white/90 border w-7 h-7 rounded-full text-xs font-bold">‹</button><button onclick="nextSlide('${id}')" class="absolute right-2 top-1/2 -translate-y-1/2 bg-white/90 border w-7 h-7 rounded-full text-xs font-bold">›</button><div class="absolute bottom-3 left-1/2 -translate-x-1/2 flex gap-1.5">${p.imgs.map((_,i)=>`<span id="dot-${id}-${i}" class="w-1.5 h-1.5 rounded-full ${i==0?'bg-black':'bg-gray-300'}"></span>`).join('')}</div>`:'';
g.innerHTML+=`<div class="border rounded-[20px] overflow-hidden"><div class="relative aspect-[4/5] overflow-hidden bg-[#fafafa]"><div class="flex h-full slide-track" id="track-${id}" style="transform:translateX(0%)">${imgsHtml}</div>${controls}<span class="absolute top-3 left-3 ${isHabis?'bg-red-600':'bg-black'} text-white text-[8px] px-3 py-1 rounded-full font-bold">${badge}</span><span class="absolute top-3 right-3 bg-white border text-[8px] px-2 py-1 rounded-full font-bold">${sisaText}</span></div><div class="p-5"><h4 class="font-bold text-[13px]">${p.name}</h4><p class="font-black text-sm mt-1">Rp ${p.price.toLocaleString('id-ID')}</p><div class="w-full bg-gray-200 h-1.5 rounded-full mt-3"><div class="${isHabis?'bg-red-600':'bg-black'} h-full" style="width:${Math.round(p.sold/p.init*100)}%"></div></div><div class="flex gap-2 mt-4" id="sizes-${id}"></div><button onclick="${isHabis?'showHabis()':'addToCart(\''+id+'\')'}" class="w-full mt-4 ${isHabis?'bg-gray-200 text-gray-400':'bg-black text-white'} py-3 rounded-full text-[11px] font-bold">${isHabis?'HABIS':'ADD TO CART'}</button></div></div>`;
});
Object.keys(PRODUCTS).forEach(id=>{
let c=document.getElementById('sizes-'+id);if(!c)return;
Object.keys(PRODUCTS[id].stock).forEach(s=>{
let q=PRODUCTS[id].stock[s];let b=document.createElement('button');b.textContent=s;b.className='border rounded-full w-10 h-10 text-[11px] font-bold '+(q==0?'opacity-20':'');if(q==0)b.disabled=true;
b.onclick=()=>{sel[id]=s;c.querySelectorAll('button').forEach(x=>x.classList.remove('bg-black','text-white'));b.classList.add('bg-black','text-white');};
c.appendChild(b);
});
});
}
function goSlide(id,i){cur[id]=i;let t=document.getElementById('track-'+id);if(t)t.style.transform='translateX(-'+(i*100)+'%)';PRODUCTS[id].imgs.forEach((_,idx)=>{let d=document.getElementById('dot-'+id+'-'+idx);if(d)d.className='w-1.5 h-1.5 rounded-full '+(idx==i?'bg-black':'bg-gray-300');});}
function nextSlide(id){goSlide(id,(cur[id]+1)%PRODUCTS[id].imgs.length);}
function prevSlide(id){goSlide(id,(cur[id]-1+PRODUCTS[id].imgs.length)%PRODUCTS[id].imgs.length);}
function showHabis(){alert('HABIS 100% TERJUAL!');}
function addToCart(id){if(!sel[id]){alert('Pilih size!');return;}cart.push({id,size:sel[id],price:PRODUCTS[id].price,name:PRODUCTS[id].name});document.getElementById('cartCount').textContent=cart.length;document.getElementById('cartCountText').textContent=cart.length;let tot=cart.reduce((a,b)=>a+b.price,0);document.getElementById('cartTotal').textContent='Rp '+tot.toLocaleString('id-ID');document.getElementById('cartItems').innerHTML=cart.map(it=>it.name+' - '+it.size).join('<br>');document.getElementById('cart').classList.remove('hidden');}
render();
setInterval(()=>{Object.keys(PRODUCTS).forEach(id=>{if(PRODUCTS[id].imgs.length>1)nextSlide(id);});},3500);
</script>
</body></html>
