<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GREGARIOUS CLUB</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-[#f5f5f0] p-3">
<div class="max-w-[1200px] mx-auto">
<div class="bg-black text-white py-2 px-4 rounded-full text-[11px] font-black text-center" id="marqueeText">★★★★★ 4.9/5 (558+ ULASAN) • UNITED AS ONE • BANDUNG</div>
<div class="grid md:grid-cols-2 gap-4 mt-4"><div class="rounded-[24px] overflow-hidden bg-black h-[400px]"><img id="heroImgEl" src="hero.jpg" class="w-full h-full object-cover"></div><div class="bg-white rounded-[24px] p-6 border-2 border-black"><p id="heroSubEl" class="text-[10px] font-black opacity-60">FOREVER YOUNG</p><h1 class="text-[40px] font-black leading-[0.9] mt-2"><span id="heroTitle1El">UNITED</span><br><span id="heroTitle2El">AS ONE</span></h1><p id="heroDescEl" class="text-[12px] mt-3 opacity-70">Koleksi eksklusif stok terbatas.</p><button onclick="document.getElementById('shop').scrollIntoView({behavior:'smooth'})" id="heroBtnEl" class="bg-black text-white px-6 py-3 rounded-full font-black text-[12px] mt-4">SHOP NOW →</button><div class="grid grid-cols-3 gap-2 mt-6"><div class="border-2 border-black rounded-[16px] p-3 text-center"><p id="stat1NumEl" class="font-black">1000+</p><p id="stat1LabelEl" class="text-[9px]">TERJUAL</p></div><div class="bg-[#FFD700] border-2 border-black rounded-[16px] p-3 text-center"><p id="stat2NumEl" class="font-black">4.9/5</p><p id="stat2LabelEl" class="text-[9px]">RATING</p></div><div class="border-2 border-black rounded-[16px] p-3 text-center"><p id="stat3NumEl" class="font-black">500+</p><p id="stat3LabelEl" class="text-[9px]">CUSTOMER</p></div></div></div></div>
<div id="shop" class="mt-8"><h2 id="shopTitleEl" class="text-[24px] font-black">SHOP COLLECTION</h2><p id="shopSubEl" class="text-[11px] opacity-60">10 PRODUK • FILE ASLI • ★<span id="ratingEl">4.9</span> • <span id="ulasanEl">558</span>+ Ulasan</p><div id="productGrid" class="grid grid-cols-2 md:grid-cols-3 gap-3 mt-4"></div></div>
</div>
<div id="cartBtn" class="fixed bottom-4 right-4 bg-black text-white px-5 py-3 rounded-full font-black text-[12px] hidden" onclick="openCart()">CART (<span id="cartCount">0</span>)</div>
<div id="productModal" class="fixed inset-0 bg-black/80 hidden z-50 p-3 flex items-center justify-center"><div class="bg-white rounded-[24px] max-w-[600px] w-full p-4"><div class="flex justify-between"><h3 id="modalName" class="font-black"></h3><button onclick="closeModal()" class="bg-black text-white px-3 py-1 rounded-full">✕</button></div><img id="modalImg" src="" class="w-full h-[300px] object-cover rounded-[16px] mt-3 border-2 border-black"><div id="modalThumbs" class="flex gap-2 mt-2"></div><p id="modalPrice" class="font-black text-[20px] mt-3"></p><div id="sizeBtns" class="grid grid-cols-4 gap-2 mt-3"></div><button onclick="addToCart()" class="w-full bg-black text-white py-3 rounded-full font-black mt-3">+ KERANJANG</button></div></div>
<div id="cartModal" class="fixed inset-0 bg-black/80 hidden z-50 p-3 flex items-center justify-center"><div class="bg-white rounded-[24px] max-w-[400px] w-full p-4"><h3 class="font-black">KERANJANG</h3><div id="cartItems" class="mt-3"></div><input id="custName" placeholder="Nama" class="w-full border-2 border-black rounded-full px-4 py-2 mt-3 text-[12px]"><input id="custWA" placeholder="WA" class="w-full border-2 border-black rounded-full px-4 py-2 mt-2 text-[12px]"><button onclick="checkout()" class="w-full bg-[#FFD700] border-2 border-black py-3 rounded-full font-black mt-3">CHECKOUT WA</button><button onclick="closeCart()" class="w-full border py-2 rounded-full mt-2 text-[11px]">Tutup</button></div></div>
<script>
let defaults=[
{id:"CROSS_BLACK",n:"CROSS TSHIRT - BLACK",p:145000,i:["cross_black.jpg"],s:{S:2,M:3,L:2,XL:1},sold:120,r:4.9},
{id:"CROSS_WHITE",n:"CROSS TSHIRT - WHITE",p:145000,i:["cross_white.jpg"],s:{S:2,M:3,L:2,XL:1},sold:98,r:4.8},
{id:"BABY_BLACK",n:"BABYTEE - BLACK",p:135000,i:["babytee_black.jpg"],s:{S:5,M:5,L:5,XL:2},sold:75,r:4.9},
{id:"BABY_WHITE",n:"BABYTEE - WHITE",p:135000,i:["babytee_white.jpg"],s:{S:5,M:5,L:5,XL:2},sold:68,r:4.9},
{id:"RICH_WP_NEW",n:"RICH BEFORE - WHITE PINK (NEW)",p:155000,i:["richbefore_wp_front.jpg","richbefore_wp_back.jpg"],s:{S:5,M:5,L:5,XL:5},sold:12,r:5.0},
{id:"RICH_WG",n:"RICH BEFORE - WHITE GREY",p:155000,i:["richbefore_wg_front.jpg","richbefore_wg_back.jpg"],s:{S:0,M:0,L:0,XL:0},sold:50,r:4.9},
{id:"RICH_BG",n:"RICH BEFORE - BLACK GREY",p:155000,i:["richbefore_bg_front.jpg","richbefore_bg_back.jpg"],s:{S:2,M:3,L:2,XL:1},sold:45,r:4.8},
{id:"RICH_BP",n:"RICH BEFORE - BLACK PINK",p:155000,i:["richbefore_bp_front.jpg","richbefore_bp_back.jpg"],s:{S:0,M:0,L:0,XL:0},sold:50,r:4.9},
{id:"RICH_WP_OLD",n:"RICH BEFORE - WHITE PINK",p:155000,i:["richbefore_wp_front.jpg","richbefore_wp_back.jpg"],s:{S:0,M:0,L:0,XL:0},sold:50,r:4.9},
{id:"FL_WHITE",n:"FUCKLOVE - WHITE",p:145000,i:["fucklove_white_front.jpg"],s:{S:3,M:3,L:3,XL:2},sold:40,r:4.9}
];
let products=JSON.parse(localStorage.getItem('GRGS_P')||JSON.stringify(defaults));
let cfg=JSON.parse(localStorage.getItem('GRGS_CFG')||'{}');
let cart=JSON.parse(localStorage.getItem('GRGS_CART')||'[]');
let sel=null,selSize=null;
function loadCfg(){if(!cfg.heroImg)return;marqueeText.innerText=cfg.marquee;heroImgEl.src=cfg.heroImg;heroTitle1El.innerText=cfg.heroTitle1;heroTitle2El.innerText=cfg.heroTitle2;heroSubEl.innerText=cfg.heroSub;heroDescEl.innerText=cfg.heroDesc;heroBtnEl.innerText=cfg.heroButton;stat1NumEl.innerText=cfg.stat1Num;stat1LabelEl.innerText=cfg.stat1Label;stat2NumEl.innerText=cfg.stat2Num;stat2LabelEl.innerText=cfg.stat2Label;stat3NumEl.innerText=cfg.stat3Num;stat3LabelEl.innerText=cfg.stat3Label;shopTitleEl.innerText=cfg.shopTitle;shopSubEl.innerText=cfg.shopSub;ratingEl.innerText=cfg.ratingAvg;ulasanEl.innerText=cfg.totalUlasan;}
function render(){let g=document.getElementById('productGrid');g.innerHTML='';products.forEach((p,i)=>{let total=Object.values(p.s).reduce((a,b)=>a+b,0);let habis=total===0;g.innerHTML+=`<div class="bg-white rounded-[16px] border-2 ${habis?'border-red-500':'border-black'} p-3 cursor-pointer" onclick="openP(${i})"><div class="rounded-[12px] overflow-hidden h-[180px] bg-gray-100 relative"><img src="${p.i[0]}" class="w-full h-full object-cover"><div class="absolute top-2 left-2 ${habis?'bg-red-600':'bg-black'} text-white px-2 py-1 rounded-full text-[9px]">${habis?'HABIS':`SISA ${total} • ★${p.r}`}</div></div><h3 class="font-black text-[11px] mt-2">${p.n}</h3><p class="font-black text-[13px]">Rp ${p.p.toLocaleString('id-ID')}</p></div>`;});}
function openP(i){sel=products[i];modalName.innerText=sel.n;modalPrice.innerText='Rp '+sel.p.toLocaleString('id-ID');modalImg.src=sel.i[0];modalThumbs.innerHTML='';sel.i.forEach((im,ix)=>{modalThumbs.innerHTML+=`<div class="w-[50px] h-[50px] rounded-[8px] overflow-hidden border-2 ${ix===0?'border-black':''} cursor-pointer" onclick="modalImg.src='${im}'"><img src="${im}" class="w-full h-full object-cover"></div>`;});sizeBtns.innerHTML='';Object.entries(sel.s).forEach(([sz,qty])=>{if(qty>0)sizeBtns.innerHTML+=`<button onclick="selSize='${sz}';document.querySelectorAll('#sizeBtns button').forEach(b=>b.className='border-2 border-black rounded-full py-2 text-[11px]');this.className='bg-black text-white rounded-full py-2 text-[11px]'" class="border-2 border-black rounded-full py-2 text-[11px]">${sz}: ${qty}</button>`;});productModal.classList.remove('hidden');}
function closeModal(){productModal.classList.add('hidden');}
function addToCart(){if(!selSize){alert('Pilih size!');return;}cart.push({n:sel.n,s:selSize,p:sel.p});localStorage.setItem('GRGS_CART',JSON.stringify(cart));updateCart();closeModal();}
function updateCart(){cartCount.innerText=cart.length;cartBtn.classList.toggle('hidden',cart.length===0);cartItems.innerHTML='';let t=0;cart.forEach((c,i)=>{t+=c.p;cartItems.innerHTML+=`<div class="flex justify-between text-[11px] border rounded-full px-3 py-2"><span>${c.n} - ${c.s}</span><button onclick="cart.splice(${i},1);localStorage.setItem('GRGS_CART',JSON.stringify(cart));updateCart()" class="text-red-500">✕</button></div>`;});}
function openCart(){updateCart();cartModal.classList.remove('hidden');}
function closeCart(){cartModal.classList.add('hidden');}
function checkout(){let name=custName.value;let wa=custWA.value;if(!name||!wa){alert('Isi nama WA');return;}let total=cart.reduce((a,b)=>a+b.p,0);let waToko=(cfg.wa||'0881023595180').replace(/[^0-9]/g,'');let msg=`Order: ${cart.map(c=>c.n+' '+c.s).join(', ')} Total Rp ${total.toLocaleString('id-ID')} Nama ${name}`;window.open(`https://wa.me/${waToko}?text=${encodeURIComponent(msg)}`,'_blank');}
loadCfg();render();updateCart();
</script>
</body></html>
