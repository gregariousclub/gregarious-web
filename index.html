<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GREGARIOUS CLUB - UNITED AS ONE</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;700;900&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>.serif{font-family:'Instrument Serif',serif}.bebas{font-family:'Bebas Neue',sans-serif}.grgs{font-family:'Inter',sans-serif;font-weight:900}.logo-oval{border:2.5px solid currentColor;border-radius:50%;padding:7px 24px;display:inline-block}.marquee{animation:marquee 25s linear infinite;display:inline-flex;white-space:nowrap}@keyframes marquee{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}.size-btn.active{background:black;color:white}</style>
</head>
<body class="bg-white text-black">
<script>
const PRODUCTS={
CROSS_BLACK:{name:"CROSS TSHIRT - BLACK",price:145000,img:"cross_black.jpg",stock:{S:2,M:3,L:2,XL:1},sold:120,initial:150},
CROSS_WHITE:{name:"CROSS TSHIRT - WHITE",price:145000,img:"cross_white.jpg",stock:{S:2,M:3,L:2,XL:1},sold:98,initial:120},
BABY_BLACK:{name:"BABYTEE RHINESTONE - BLACK",price:135000,img:"babytee_black.jpg",stock:{S:5,M:5,L:5,XL:2},sold:75,initial:100},
BABY_WHITE:{name:"BABYTEE RHINESTONE - WHITE",price:135000,img:"babytee_white.jpg",stock:{S:5,M:5,L:5,XL:2},sold:68,initial:100},
RICH_WP_NEW:{name:"RICH BEFORE TSHIRT - WHITE PINK (NEW)",price:155000,img:"richbefore_wp_front.jpg",stock:{S:5,M:5,L:5,XL:5},sold:12,initial:50},
RICH_WG:{name:"RICH BEFORE TSHIRT - WHITE GREY",price:155000,img:"richbefore_wg_front.jpg",stock:{S:0,M:0,L:0,XL:0},sold:50,initial:50},
RICH_BG:{name:"RICH BEFORE TSHIRT - BLACK GREY",price:155000,img:"richbefore_bg_front.jpg",stock:{S:2,M:3,L:2,XL:1},sold:45,initial:50},
RICH_BP:{name:"RICH BEFORE TSHIRT - BLACK PINK",price:155000,img:"richbefore_bp_front.jpg",stock:{S:0,M:0,L:0,XL:0},sold:50,initial:50},
RICH_WP:{name:"RICH BEFORE TSHIRT - WHITE PINK",price:155000,img:"richbefore_wp_front.jpg",stock:{S:0,M:0,L:0,XL:0},sold:50,initial:50},
FL_WHITE:{name:"FUCKLOVE TSHIRT - WHITE",price:145000,img:"fucklove_white_front.jpg",stock:{S:3,M:3,L:3,XL:2},sold:40,initial:60}
};
const ONGKIR={"JNE Reguler 2-3 hari":15000,"JNE YES 1 hari":30000,"J&T REG":14000,"J&T ECO":11000};
</script>
<div class="bg-black text-white py-2.5 overflow-hidden whitespace-nowrap"><div class="marquee text-[11px] tracking-[0.25em] font-bold"><span class="mx-10">UNITED AS ONE • BANDUNG • GRGS</span><span class="mx-10">UNITED AS ONE • BANDUNG • GRGS</span></div></div>
<header class="sticky top-0 z-40 bg-white/95 backdrop-blur border-b flex justify-between items-center px-6 py-4"><div class="logo-oval grgs">GRGS</div><button onclick="document.getElementById('cart').classList.remove('hidden')" class="border border-black px-5 py-2 rounded-full text-[11px] font-bold">CART <span id="cartCount">0</span></button></header>
<section id="home" class="relative h-[88vh] bg-black text-white flex items-center justify-center text-center overflow-hidden"><img src="hero.jpg" class="absolute inset-0 w-full h-full object-cover opacity-80"><div class="absolute inset-0 bg-black/40"></div><div class="relative z-10 px-6"><div class="logo-oval grgs text-[22px] mb-6 border-white text-white">GRGS</div><h1 class="serif text-[56px] leading-[0.9]">UNITED<br>AS ONE</h1><a href="#shop" class="mt-10 inline-block bg-white text-black px-12 py-4 rounded-full text-[12px] font-bold">SHOP NOW</a><div class="mt-8 text-[10px]">★ 4.9/5 (558+ TERJUAL)</div></div></section>
<section id="shop" class="max-w-[1300px] mx-auto px-4 py-12"><h2 class="bebas text-[44px] text-center">SHOP COLLECTION</h2><p class="text-[11px] text-center opacity-50">10 PRODUK • 4.9/5 RATING • BRI & SEABANK</p><div id="productGrid" class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-8"></div></section>
<div id="cart" class="fixed inset-0 z-[100] hidden"><div class="absolute inset-0 bg-black/60" onclick="this.parentElement.classList.add('hidden')"></div><div class="absolute right-0 top-0 h-full w-[92%] md:w-[420px] bg-white p-6 flex flex-col"><div class="flex justify-between items-center"><h3 class="bebas text-[28px]">CART (<span id="cartCountText">0</span>)</h3><button onclick="document.getElementById('cart').classList.add('hidden')" class="font-bold">✕</button></div><div id="cartItems" class="flex-1 py-4 overflow-auto border-t mt-4"></div><div class="border-t pt-4"><div class="flex justify-between text-[11px]"><span>Subtotal</span><span id="subtotalText">Rp 0</span></div><div class="flex justify-between font-bold text-[16px] mt-3 pt-3 border-t"><span>TOTAL</span><span id="cartTotal">Rp 0</span></div><button onclick="openCheckout()" class="w-full bg-black text-white py-4 rounded-full mt-4 text-[11px] font-bold">CHECKOUT & BAYAR →</button></div></div></div>
<div id="checkoutModal" class="fixed inset-0 z-[110] hidden"><div class="absolute inset-0 bg-black/70" onclick="this.parentElement.classList.add('hidden')"></div><div class="absolute bottom-0 md:top-1/2 md:left-1/2 md:-translate-x-1/2 md:-translate-y-1/2 bg-white w-full md:w-[460px] p-6 md:rounded-[20px] max-h-[95vh] overflow-auto"><h3 class="bebas text-[28px]">CHECKOUT</h3><input id="custName" placeholder="Nama Lengkap *" class="w-full border p-3 mt-4 text-[13px] rounded-full px-4"><input id="custWa" placeholder="No WA *" class="w-full border p-3 mt-2 text-[13px] rounded-full px-4"><textarea id="custAddr" placeholder="Alamat Lengkap *" class="w-full border p-3 mt-2 text-[13px] rounded-[16px] px-4 h-[60px]"></textarea><select id="shipMethod" onchange="updateCart()" class="w-full border p-3 mt-2 text-[12px] rounded-full px-4"></select><div id="checkoutSummary" class="bg-gray-100 p-4 text-[11px] mt-4 rounded-[12px]"></div><button onclick="processPayment()" class="w-full bg-black text-white py-4 rounded-full mt-4 text-[11px] font-bold">LANJUT KE PEMBAYARAN →</button></div></div>
<div id="paymentModal" class="fixed inset-0 z-[120] hidden bg-white overflow-auto"><div class="max-w-[460px] mx-auto min-h-screen p-6"><div class="text-center mt-6"><h2 id="payTotal" class="bebas text-[40px]">Rp 0</h2><p>Order ID: <span id="orderId">#GRGS000</span></p></div><div id="payDetails" class="mt-8"></div><button onclick="confirmPayment()" class="w-full bg-black text-white py-4 rounded-full mt-6">✅ SAYA SUDAH BAYAR</button></div></div>
<div id="successModal" class="fixed inset-0 z-[130] hidden bg-white"><div class="max-w-[460px] mx-auto min-h-screen p-6 flex flex-col items-center justify-center text-center"><div class="w-20 h-20 bg-green-500 rounded-full flex items-center justify-center text-[32px] text-white">✓</div><h2 class="bebas text-[36px] mt-6">PEMBAYARAN<br>TERKIRIM!</h2><button onclick="location.reload()" class="w-full bg-black text-white py-4 rounded-full mt-8">KEMBALI KE TOKO</button></div></div>
<script>
let selected={},cart=[];const shipSel=document.getElementById('shipMethod');Object.entries(ONGKIR).forEach(([n,h])=>{let o=document.createElement('option');o.value=n;o.textContent=n+" - Rp "+h.toLocaleString('id-ID');shipSel.appendChild(o);});
function getOngkir(){return ONGKIR[shipSel.value]||15000;}
function renderProducts(){let g=document.getElementById('productGrid');g.innerHTML='';Object.keys(PRODUCTS).forEach(id=>{let p=PRODUCTS[id];let sisa=Object.values(p.stock).reduce((a,b)=>a+b,0);let percent=Math.round((p.sold/p.initial)*100);let isHabis=sisa==0;let badge=isHabis?'🔥 HABIS 100% TERJUAL':percent+'% TERJUAL';let badgeColor=isHabis?'bg-red-600':'bg-black';let barColor=isHabis?'bg-red-600':'bg-black';let sisaText=isHabis?'HABIS':(sisa<=3?'⚠️ SISA '+sisa+' LAGI!':'Sisa '+sisa);let btnText=isHabis?'🔥 HABIS - LIHAT LAIN':'ADD TO CART';let btnClass=isHabis?'bg-gray-300 text-gray-500':'bg-black text-white';let btnAction=isHabis?"alert('HABIS!')":"addToCart('"+id+"')";g.innerHTML+=`<div class="border rounded-[20px] overflow-hidden"><div class="aspect-[4/5] bg-[#fafafa] relative flex items-center justify-center"><img src="${p.img}" class="w-full h-full object-contain p-8"><span class="absolute top-4 left-4 ${badgeColor} text-white text-[9px] px-3 py-1.5 rounded-full font-bold">${badge}</span><span class="absolute top-4 right-4 bg-white border text-[9px] px-2.5 py-1 rounded-full">${sisaText}</span></div><div class="p-5"><h4 class="font-bold text-[13px]">${p.name}</h4><p class="font-black text-[14px]">Rp ${p.price.toLocaleString('id-ID')}</p><div class="w-full bg-gray-200 h-1.5 rounded-full mt-3"><div class="${barColor} h-full" style="width:${percent}%"></div></div><div class="flex gap-2 mt-4" id="sizes-${id}"></div><button onclick="${btnAction}" class="w-full mt-4 ${btnClass} py-3.5 rounded-full text-[11px] font-bold">${btnText}</button></div></div>`;});renderSizes();}
function renderSizes(){Object.keys(PRODUCTS).forEach(id=>{let cont=document.getElementById('sizes-'+id);if(!cont)return;cont.innerHTML='';Object.keys(PRODUCTS[id].stock).forEach(s=>{let q=PRODUCTS[id].stock[s];let b=document.createElement('button');b.textContent=s;b.className='size-btn border rounded-full w-10 h-10 text-[11px] font-bold '+(q==0?'opacity-20':'');if(q==0)b.disabled=true;b.onclick=()=>{selected[id]=s;cont.querySelectorAll('button').forEach(x=>x.classList.remove('active'));b.classList.add('active');};cont.appendChild(b);});});}
function addToCart(id){let s=selected[id];if(!s)return alert('Pilih size!');cart.push({id,size:s,price:PRODUCTS[id].price,name:PRODUCTS[id].name});PRODUCTS[id].stock[s]--;updateCart();document.getElementById('cart').classList.remove('hidden');renderProducts();}
function updateCart(){document.getElementById('cartCount').textContent=cart.length;document.getElementById('cartCountText').textContent=cart.length;let sub=cart.reduce((a,b)=>a+b.price,0),ong=cart.length>0?getOngkir():0,tot=sub+ong;document.getElementById('subtotalText').textContent='Rp '+sub.toLocaleString('id-ID');document.getElementById('cartTotal').textContent='Rp '+tot.toLocaleString('id-ID');document.getElementById('cartItems').innerHTML=cart.map((it,idx)=>'<div class="flex justify-between py-3 border-b text-[12px]"><div><b>'+it.name+'</b><br><span>Size '+it.size+'</span></div><div>Rp '+it.price.toLocaleString('id-ID')+'</div></div>').join('');document.getElementById('checkoutSummary').innerHTML=cart.map(i=>'• '+i.name+' '+i.size).join('<br>')+'<br><br><b>TOTAL Rp '+tot.toLocaleString('id-ID')+'</b>';}
function openCheckout(){if(!cart.length)return;document.getElementById('cart').classList.add('hidden');document.getElementById('checkoutModal').classList.remove('hidden');updateCart();}
function processPayment(){let n=document.getElementById('custName').value.trim();if(!n)return alert('Lengkapi!');let sub=cart.reduce((a,b)=>a+b.price,0),ong=getOngkir(),tot=sub+ong;document.getElementById('checkoutModal').classList.add('hidden');document.getElementById('paymentModal').classList.remove('hidden');document.getElementById('orderId').textContent='#GRGS'+Date.now().toString().slice(-6);document.getElementById('payTotal').textContent='Rp '+tot.toLocaleString('id-ID');document.getElementById('payDetails').innerHTML='<div class="border-2 border-black rounded-[16px] p-5"><p>TRANSFER BRI 074901024253504<br>SEABANK 901100694312</p></div>';}
function confirmPayment(){alert('Terima kasih!');location.reload();}
renderProducts();
</script>
</body>
</html>
