<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GREGARIOUS CLUB - CROSS TSHIRT</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@900&display=swap" rel="stylesheet">
<style>
.serif{font-family:'Instrument Serif',serif}
.grgs{font-family:'Inter',sans-serif;font-weight:900}
.logo-oval{border:2.5px solid currentColor;border-radius:50%;padding:6px 22px;display:inline-block;position:relative}
.logo-oval::before{content:'';position:absolute;inset:3px;border:1px solid currentColor;border-radius:50%;opacity:.8}
.size-disabled{opacity:.25;pointer-events:none;text-decoration:line-through;position:relative}
.size-disabled::after{content:'SOLD OUT';position:absolute;top:-8px;left:50%;transform:translateX(-50%);font-size:7px;background:black;color:white;padding:1px 4px;text-decoration:none}
</style>
</head>
<body class="bg-white text-black">
<header class="bg-white sticky top-0 z-50 flex justify-between items-center px-6 py-3.5 border-b">
<button>☰</button>
<div class="logo-oval grgs text-[18px]">GRGS</div>
<button onclick="openCart()">🛒 <span id="cartCount" class="bg-black text-white text-[10px] w-5 h-5 rounded-full hidden">0</span></button>
</header>
<section class="relative h-[70vh] bg-black text-white flex items-center justify-center text-center overflow-hidden">
<img src="hero.jpg" onerror="this.src='https://images.unsplash.com/photo-1529156069898-49953e39b3ac?q=80&w=2000'" class="absolute inset-0 w-full h-full object-cover">
<div class="absolute inset-0 bg-black/60"></div>
<div class="relative z-10">
<div class="logo-oval grgs text-[20px] mb-4 text-white">GRGS</div>
<h1 class="serif text-[48px] leading-[0.85]">CROSS<br>TSHIRT</h1>
<p class="mt-2 text-[10px] tracking-[0.3em] opacity-60">BLACK L=2 | WHITE M=3 L=2 XL=1</p>
</div>
</section>
<section class="px-4 py-10 max-w-6xl mx-auto">
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<div class="border border-black/10">
<div class="aspect-[4/5] bg-[#f5f5f5] relative">
<img src="cross_black.jpg" class="w-full h-full object-contain p-4">
<div class="absolute top-3 left-3 bg-red-600 text-white text-[9px] px-2 py-1">ONLY 2 LEFT!</div>
</div>
<div class="p-4">
<h3 class="font-bold text-[14px]">CROSS TSHIRT - BLACK</h3>
<p class="text-[11px] opacity-60">Rp 259.000</p>
<div class="flex gap-2 mt-3" id="sizes-BLACK"></div>
<p class="text-[10px] mt-2 h-4" id="stockInfo-BLACK"></p>
<button id="btn-BLACK" onclick="addToCart('BLACK')" class="mt-3 w-full bg-black text-white py-3 text-[12px] font-bold">ADD TO CART</button>
</div>
</div>
<div class="border border-black/10">
<div class="aspect-[4/5] bg-[#f5f5f5] relative">
<img src="cross_white.jpg" class="w-full h-full object-contain p-4">
<div class="absolute top-3 left-3 bg-black text-white text-[9px] px-2 py-1">LOW STOCK</div>
</div>
<div class="p-4">
<h3 class="font-bold text-[14px]">CROSS TSHIRT - WHITE</h3>
<p class="text-[11px] opacity-60">Rp 259.000</p>
<div class="flex gap-2 mt-3" id="sizes-WHITE"></div>
<p class="text-[10px] mt-2 h-4" id="stockInfo-WHITE"></p>
<button id="btn-WHITE" onclick="addToCart('WHITE')" class="mt-3 w-full bg-black text-white py-3 text-[12px] font-bold">ADD TO CART</button>
</div>
</div>
</div>
</section>
<div id="cartDrawer" class="fixed inset-0 z-50 hidden">
<div class="absolute inset-0 bg-black/60" onclick="closeCart()"></div>
<div class="absolute right-0 top-0 h-full w-[88%] md:w-[400px] bg-white p-6 flex flex-col">
<div class="flex justify-between border-b pb-4"><h3 class="font-bold">CART (<span id="cartCountText">0</span>)</h3><button onclick="closeCart()">✕</button></div>
<div id="cartItems" class="flex-1 py-4"></div>
<div class="border-t pt-4"><div class="flex justify-between font-bold mb-4"><span>Total</span><span id="cartTotal">Rp 0</span></div><button onclick="openCheckout()" class="w-full bg-black text-white py-4 text-xs font-bold">CHECKOUT DI WEBSITE</button></div>
</div>
</div>
<div id="checkoutModal" class="fixed inset-0 z-[60] hidden">
<div class="absolute inset-0 bg-black/70" onclick="closeCheckout()"></div>
<div class="absolute bottom-0 md:top-1/2 md:left-1/2 md:-translate-x-1/2 md:-translate-y-1/2 bg-white w-full md:w-[420px] p-6">
<h3 class="serif text-2xl mb-4">CHECKOUT</h3>
<input id="custName" placeholder="Nama Lengkap" class="w-full border p-3 mb-2 text-sm">
<input id="custWa" placeholder="WA 08xx" class="w-full border p-3 mb-2 text-sm">
<input id="custAddr" placeholder="Alamat Lengkap" class="w-full border p-3 mb-4 text-sm">
<div id="checkoutSummary" class="bg-gray-50 p-3 text-xs mb-4"></div>
<button onclick="placeOrder()" class="w-full bg-black text-white py-4 font-bold text-xs tracking-widest">PESAN SEKARANG</button>
</div>
</div>
<script>
const STOCK = {
  BLACK: { S: 0, M: 0, L: 2, XL: 0 },
  WHITE: { S: 0, M: 3, L: 2, XL: 1 }
};
let selected = { BLACK: null, WHITE: null };
let cart = [];
function renderSizes(){
  ['BLACK','WHITE'].forEach(color=>{
    const cont = document.getElementById('sizes-'+color);
    cont.innerHTML = '';
    Object.keys(STOCK[color]).forEach(size=>{
      const qty = STOCK[color][size];
      const btn = document.createElement('button');
      btn.innerText = size;
      btn.className = 'border px-4 py-2 text-[12px] font-bold ' + (qty===0? 'size-disabled' : 'hover:bg-black hover:text-white');
      if(qty===0) btn.disabled=true;
      btn.onclick = ()=>{
        if(qty===0) return;
        selected[color]=size;
        document.querySelectorAll('#sizes-'+color+' button').forEach(b=>b.classList.remove('bg-black','text-white'));
        btn.classList.add('bg-black','text-white');
        const info = document.getElementById('stockInfo-'+color);
        info.innerText = qty<=2? '⚠️ Sisa '+qty+' pcs aja!' : '✓ Ready '+qty+' pcs';
        info.className = 'text-[10px] mt-2 h-4 ' + (qty<=2? 'text-red-600 font-bold' : 'text-green-600');
      };
      cont.appendChild(btn);
    });
    const first = Object.keys(STOCK[color]).find(s=>STOCK[color][s]>0);
    if(first){
      selected[color]=first;
      setTimeout(()=>{
        document.querySelectorAll('#sizes-'+color+' button').forEach(b=>{
          if(b.innerText===first) b.click();
        });
      },100);
    } else {
      document.getElementById('btn-'+color).innerText='SOLD OUT';
      document.getElementById('btn-'+color).disabled=true;
    }
  });
}
function addToCart(color){
  const size = selected[color];
  if(!size){ alert('Pilih size dulu bos!'); return; }
  if(STOCK[color][size]<=0){ alert('Size '+size+' habis bos!'); return; }
  const count = cart.filter(i=>i.color===color && i.size===size).length;
  if(count >= STOCK[color][size]){ alert('Stok size '+size+' cuma '+STOCK[color][size]+' pcs bos!'); return; }
  cart.push({ name: 'CROSS '+color+' Size '+size, price: 259000, color, size });
  STOCK[color][size]--;
  updateCart();
  openCart();
  renderSizes();
}
function updateCart(){
  const countEl = document.getElementById('cartCount');
  countEl.innerText = cart.length;
  countEl.classList.toggle('hidden', cart.length==0);
  document.getElementById('cartCountText').innerText = cart.length;
  let total = cart.reduce((a,b)=>a+b.price,0);
  document.getElementById('cartTotal').innerText = 'Rp '+total.toLocaleString('id-ID');
  document.getElementById('cartItems').innerHTML = cart.map((i,idx)=>`
    <div class="flex justify-between border-b border-black/10 pb-2 text-sm">
      <span>${i.color} Size ${i.size}</span>
      <span>Rp ${i.price.toLocaleString('id-ID')} <button onclick="removeItem(${idx})" class="opacity-30 ml-2">✕</button></span>
    </div>`).join('') || '<p class="text-center py-10 opacity-40 text-sm">Keranjang kosong</p>';
  document.getElementById('checkoutSummary').innerHTML = cart.map(i=>`• ${i.color} Size ${i.size}`).join('<br>') + '<br><br><b>Total: Rp '+total.toLocaleString('id-ID')+'</b>';
}
function removeItem(idx){
  const item = cart[idx];
  STOCK[item.color][item.size]++;
  cart.splice(idx,1);
  updateCart();
  renderSizes();
}
function openCart(){ document.getElementById('cartDrawer').classList.remove('hidden'); }
function closeCart(){ document.getElementById('cartDrawer').classList.add('hidden'); }
function openCheckout(){ if(cart.length==0) return; closeCart(); document.getElementById('checkoutModal').classList.remove('hidden'); }
function closeCheckout(){ document.getElementById('checkoutModal').classList.add('hidden'); }
function placeOrder(){
  let n = document.getElementById('custName').value;
  let w = document.getElementById('custWa').value;
  let a = document.getElementById('custAddr').value;
  if(!n ||!w){ alert('Isi nama & WA bos!'); return; }
  let t = cart.reduce((a,b)=>a+b.price,0);
  let txt = `ORDER CROSS TSHIRT:%0A${cart.map(i=>`- ${i.color} Size ${i.size}`).join('%0A')}%0ANama:${n}%0AWA:${w}%0AAlamat:${a}%0ATotal:Rp ${t.toLocaleString('id-ID')}`;
  window.open('https://wa.me/62881023595180?text='+txt,'_blank');
  cart=[]; updateCart(); closeCheckout();
}
renderSizes();
</script>
</body>
</html>
