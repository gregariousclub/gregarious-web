<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GREGARIOUS CLUB - OFFICIAL STORE V42</title><script src="https://cdn.tailwindcss.com"></script><style>#drawer{transform:translateX(-100%);transition:.3s}#drawer.open{transform:translateX(0)}</style></head><body class="bg-[#fafaf9] text-black">
<header class="bg-white border-b border-black/10 p-4 flex justify-between"><button onclick="drawer.classList.toggle('open')">☰</button><b>GRGS</b><button onclick="openCart()">🛒<span id="cartCountHead">0</span></button></header>
<div id="drawer" class="fixed inset-0 z-50 flex"><div class="bg-white w-[300px] p-6"><button onclick="drawer.classList.remove('open')">✕</button><button onclick="shop.scrollIntoView({behavior:'smooth'});drawer.classList.remove('open')" class="mt-6 bg-black text-white w-full py-3 rounded-full">SHOP</button></div><div class="flex-1 bg-black/50" onclick="drawer.classList.remove('open')"></div></div>
<section id="shop" class="p-4"><div id="productGrid" class="grid grid-cols-2 md:grid-cols-4 gap-3"></div></section>
<div id="productModal" class="fixed inset-0 bg-black/90 hidden z-50 p-4 flex items-center justify-center"><div class="bg-white rounded-[20px] max-w-[480px] w-full p-5"><div class="flex justify-between"><h3 id="modalName" class="font-bold"></h3><button onclick="closeModal()" class="bg-black text-white w-8 h-8 rounded-full">✕</button></div><img id="modalImg" class="w-full h-[400px] object-cover rounded-[14px] mt-3 border"><div id="modalThumbs" class="flex gap-2 mt-3"></div><p id="modalPrice" class="font-bold text-[20px] mt-3"></p><p class="text-[11px] opacity-60">Stock <span id="modalSisa"></span> • <span id="modalTerjual"></span> terjual</p><div id="sizeBtns" class="grid grid-cols-4 gap-2 mt-4"></div><button onclick="addToCart()" class="w-full bg-black text-white py-3 rounded-full mt-4">ADD TO CART</button></div></div>
<div id="cartModal" class="fixed inset-0 bg-white hidden z-[60] p-0 overflow-auto"><div class="max-w-[440px] mx-auto min-h-screen p-6"><div class="flex justify-between"><h3 class="font-bold">Checkout - Secure • Verified</h3><button onclick="closeCart()">✕</button></div><div id="cartItems" class="mt-4 space-y-2"></div><input id="custName" placeholder="Nama lengkap" class="w-full border rounded-full px-5 py-3 mt-4"><input id="custWA" placeholder="WA 08xx" class="w-full border rounded-full px-5 py-3 mt-2"><textarea id="custAddr" placeholder="Alamat lengkap + patokan" class="w-full border rounded-[16px] px-5 py-3 mt-2 h-[70px]"></textarea><select id="custOngkir" onchange="updateCart()" class="w-full border rounded-full px-5 py-3 mt-2 bg-white"></select><div class="bg-[#fafaf9] border rounded-[16px] p-4 mt-4"><p class="text-[11px] font-bold">SECURE TRANSFER • VERIFIED</p><p class="text-[12px] mt-2">BRI: <span id="payBRI">074901024253504</span></p><p class="text-[12px]">SeaBank: <span id="paySEABANK">901100694312</span></p><div class="mt-3 pt-3 border-t border-dashed flex justify-between"><div><p class="text-[10px] opacity-50">AMOUNT TO TRANSFER</p><p id="checkoutTotalClean" class="font-bold text-[22px]">Rp 0</p><p id="uniqueCodeInfoClean" class="text-[11px] opacity-60"></p></div><div><p class="text-[10px] opacity-50">CODE</p><p id="uniqueCodeSmall" class="font-bold">+0</p></div></div></div><div class="mt-4"><label class="text-[11px] font-bold">Payment proof • Required</label><input id="buktiTF" type="file" accept="image/*" class="w-full border border-dashed rounded-full px-5 py-3 mt-2"><img id="buktiPreview" class="w-full h-[160px] object-contain rounded-[12px] mt-2 border hidden"></div><button onclick="secureCheckout()" class="w-full bg-black text-white py-4 rounded-full mt-6">CONFIRM ORDER • <span id="checkoutBtnTotal">Rp 0</span></button></div></div>
<script>
const CLOUD_ID="f8e36b76daf1d55776f9";const CLOUD_URL="https://api.npoint.io/"+CLOUD_ID;
async function cloudSave(){let o=JSON.parse(localStorage.getItem('GRGS_ORDERS')||'[]');let d={products:products,cfg:cfg,ongkir:ongkir,ulasan:ulasan,orders:o,updated:Date.now()};try{await fetch(CLOUD_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});}catch(e){}}
async function cloudLoad(){try{let r=await fetch(CLOUD_URL+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)return false;let d=await r.json();if(d.products&&d.products.length>=3){products=d.products;localStorage.setItem('GRGS_P',JSON.stringify(products));}if(d.cfg){cfg=Object.assign({},DEF_CFG,d.cfg);localStorage.setItem('GRGS_CFG',JSON.stringify(cfg));}if(d.ongkir){ongkir=d.ongkir;localStorage.setItem('GRGS_ONGKIR',JSON.stringify(ongkir));}if(d.ulasan){ulasan=d.ulasan;localStorage.setItem('GRGS_ULASAN',JSON.stringify(ulasan));}if(d.orders){localStorage.setItem('GRGS_ORDERS',JSON.stringify(d.orders));}return true;}catch(e){return false;}}
let DEFAULTS=[
{id:"CROSS_BLACK",n:"CROSS TSHIRT - BLACK",p:145000,i:["cross_black.jpg","cross_black_back.jpg"],s:{S:2,M:3,L:2,XL:1},sold:120,r:4.9},
{id:"CROSS_WHITE",n:"CROSS TSHIRT - WHITE",p:145000,i:["cross_white.jpg","cross_white_back.jpg"],s:{S:2,M:3,L:2,XL:1},sold:98,r:4.8},
{id:"BABY_BLACK",n:"BABYTEE - BLACK",p:135000,i:["babytee_black.jpg","babytee_black_back.jpg"],s:{S:5,M:5,L:5,XL:2},sold:75,r:4.9},
{id:"BABY_WHITE",n:"BABYTEE - WHITE",p:135000,i:["babytee_white.jpg","babytee_white_back.jpg"],s:{S:5,M:5,L:5,XL:2},sold:68,r:4.9},
{id:"RICH_WP_NEW",n:"RICH BEFORE - WHITE PINK (NEW)",p:155000,i:["richbefore_wp_front.jpg","richbefore_wp_back.jpg"],s:{S:5,M:5,L:5,XL:5},sold:12,r:5.0},
{id:"RICH_WG",n:"RICH BEFORE - WHITE GREY",p:155000,i:["richbefore_wg_front.jpg","richbefore_wg_back.jpg"],s:{S:0,M:0,L:0,XL:0},sold:50,r:4.9},
{id:"RICH_BG",n:"RICH BEFORE - BLACK GREY",p:155000,i:["richbefore_bg_front.jpg","richbefore_bg_back.jpg"],s:{S:2,M:3,L:2,XL:1},sold:45,r:4.8},
{id:"RICH_BP",n:"RICH BEFORE - BLACK PINK",p:155000,i:["richbefore_bp_front.jpg","richbefore_bp_back.jpg"],s:{S:0,M:0,L:0,XL:0},sold:50,r:4.9},
{id:"RICH_WP_OLD",n:"RICH BEFORE - WHITE PINK",p:155000,i:["richbefore_wp_front_old.jpg","richbefore_wp_back_old.jpg"],s:{S:0,M:0,L:0,XL:0},sold:50,r:4.9},
{id:"FL_WHITE",n:"FUCKLOVE - WHITE",p:145000,i:["fucklove_white_front.jpg","fucklove_white_back.jpg"],s:{S:3,M:3,L:3,XL:2},sold:40,r:4.9}
];
let DEF_CFG={wa:"0881023595180",bri:"074901024253504",seabank:"901100694312",headerLogo:"GRGS",marquee:"SECURE CHECKOUT"};
let DEF_ONGKIR=[{n:"BANDUNG - JNE OKE",p:10000},{n:"JABODETABEK - JNE REG",p:13000},{n:"J&T REG",p:12000}];
let DEF_ULASAN=[{name:"Andi",text:"Mantep",star:5}];
let products=JSON.parse(localStorage.getItem('GRGS_P')||'null')||JSON.parse(JSON.stringify(DEFAULTS));
let cfg=Object.assign({},DEF_CFG,JSON.parse(localStorage.getItem('GRGS_CFG')||'null')||{});
let ongkir=JSON.parse(localStorage.getItem('GRGS_ONGKIR')||'null')||DEF_ONGKIR;
let ulasan=JSON.parse(localStorage.getItem('GRGS_ULASAN')||'null')||DEF_ULASAN;
let cart=JSON.parse(localStorage.getItem('GRGS_CART')||'[]');let sel=null,selSize=null,buktiBase64=null;let uniqueCode=Math.floor(Math.random()*900)+100;
function normWA(n){let d=(n+'').replace(/[^0-9]/g,'');if(d.startsWith('0'))return'62'+d.slice(1);return d;}
document.getElementById('buktiTF').addEventListener('change',function(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=function(ev){buktiBase64=ev.target.result;buktiPreview.src=buktiBase64;buktiPreview.classList.remove('hidden');};r.readAsDataURL(f);});
function renderProducts(){productGrid.innerHTML='';products.forEach(function(p,i){let tot=Object.values(p.s).reduce((a,b)=>a+b,0);productGrid.innerHTML+='<div class="bg-white rounded-[16px] border p-2 cursor-pointer" onclick="openP('+i+')"><div class="h-[200px] bg-[#eee] rounded-[12px] overflow-hidden relative"><img src="'+p.i[0]+'" onerror="this.src=\'https://via.placeholder.com/300\'" class="w-full h-full object-cover"><div class="absolute bottom-2 right-2 bg-black text-white text-[9px] px-2 py-1 rounded-full">+'+p.i.length+' FOTO</div></div><p class="text-[11px] font-bold mt-2">'+p.n+'</p><p class="text-[12px]">Rp '+p.p.toLocaleString('id-ID')+'</p></div>';});}
function openP(i){sel=products[i];modalName.innerText=sel.n;modalPrice.innerText='Rp '+sel.p.toLocaleString('id-ID');modalSisa.innerText=Object.values(sel.s).reduce((a,b)=>a+b,0);modalTerjual.innerText=sel.sold;modalImg.src=sel.i[0];modalThumbs.innerHTML='';sel.i.forEach(function(im,idx){modalThumbs.innerHTML+='<div class="w-[60px] h-[60px] rounded-[10px] overflow-hidden border-2 '+(idx==0?'border-black':'border-neutral-200')+' cursor-pointer" onclick="modalImg.src=\''+im+'\'"><img src="'+im+'" onerror="this.src=\'https://via.placeholder.com/100\'" class="w-full h-full object-cover"></div>';});sizeBtns.innerHTML='';["S","M","L","XL"].forEach(function(sz){let q=sel.s[sz]||0;if(q>0)sizeBtns.innerHTML+='<button id="size_'+sz+'" onclick="selectSize(\''+sz+'\')" class="border rounded-full py-2 text-[11px]">'+sz+' ('+q+')</button>';else sizeBtns.innerHTML+='<button disabled class="border rounded-full py-2 text-[11px] opacity-30">'+sz+' HABIS</button>';});productModal.classList.remove('hidden');}
function selectSize(sz){selSize=sz;document.querySelectorAll('#sizeBtns button').forEach(b=>{if(b.id)b.className='border rounded-full py-2 text-[11px]';});document.getElementById('size_'+sz).className='bg-black text-white border rounded-full py-2 text-[11px]';}
function closeModal(){productModal.classList.add('hidden');selSize=null;}
function addToCart(){if(!selSize)return alert('Pilih size');cart.push({n:sel.n,s:selSize,p:sel.p});localStorage.setItem('GRGS_CART',JSON.stringify(cart));updateCart();closeModal();}
function updateCart(){cartCountHead.innerText=cart.length;cartItems.innerHTML='';let tot=0;cart.forEach(function(c,i){tot+=c.p;cartItems.innerHTML+='<div class="flex justify-between border rounded-full px-4 py-2 text-[12px]"><span>'+c.n+' • '+c.s+'</span><button onclick="cart.splice('+i+',1);localStorage.setItem(\'GRGS_CART\',JSON.stringify(cart));updateCart()">✕</button></div>';});custOngkir.innerHTML='';ongkir.forEach(function(o){custOngkir.innerHTML+='<option value="'+o.p+'">'+o.n+' - Rp '+o.p.toLocaleString('id-ID')+'</option>';});let ong=parseInt(custOngkir.value||10000);let finalTotal=tot+ong+uniqueCode;checkoutTotalClean.innerText='Rp '+finalTotal.toLocaleString('id-ID');checkoutBtnTotal.innerText='Rp '+finalTotal.toLocaleString('id-ID');uniqueCodeInfoClean.innerText='Termasuk kode unik Rp '+uniqueCode+' • Jangan dibulatkan';uniqueCodeSmall.innerText='+'+uniqueCode;payBRI.innerText=cfg.bri;paySEABANK.innerText=cfg.seabank;return finalTotal;}
function openCart(){updateCart();cartModal.classList.remove('hidden');}
function closeCart(){cartModal.classList.add('hidden');}
async function secureCheckout(){let nm=custName.value.trim(),wa=custWA.value.trim(),addr=custAddr.value.trim();if(!nm||!wa||!addr||cart.length==0)return alert('Lengkapi nama WA alamat');if(!buktiBase64)return alert('Wajib upload bukti TF!');let ong=parseInt(custOngkir.value)||10000;let ongName=custOngkir.options[custOngkir.selectedIndex].text;let sub=cart.reduce((a,b)=>a+b.p,0);let total=sub+ong+uniqueCode;let orderId='GRGS-'+Date.now().toString().slice(-6)+'-'+uniqueCode;let orders=JSON.parse(localStorage.getItem('GRGS_ORDERS')||'[]');orders.push({orderId:orderId,name:nm,wa:wa,addr:addr,items:JSON.parse(JSON.stringify(cart)),subtotal:sub,ongkir:ong,ongkirName:ongName,uniqueCode:uniqueCode,total:total,bukti:buktiBase64,date:new Date().toISOString(),dateStr:new Date().toLocaleString('id-ID'),status:'MENUNGGU_VERIFIKASI'});localStorage.setItem('GRGS_ORDERS',JSON.stringify(orders));await cloudSave();let waToko=normWA(cfg.wa);let itemsDetail=cart.map(c=> '• '+c.n+' Size '+c.s+' - Rp '+c.p.toLocaleString('id-ID')).join('%0A');let pesan='🔔 ORDER BARU #'+orderId+' - MENUNGGU VERIFIKASI%0A%0A👤 PEMBELI:%0ANama: '+nm+'%0AWA: '+wa+'%0AAlamat: '+addr+'%0A%0A🛒 DETAIL PESANAN:%0A'+itemsDetail+'%0A%0A💰 RINCIAN BIAYA:%0ASubtotal: Rp '+sub.toLocaleString('id-ID')+'%0AOngkir '+ongName+': Rp '+ong.toLocaleString('id-ID')+'%0AKode Unik: Rp '+uniqueCode+'%0ATOTAL WAJIB: Rp '+total.toLocaleString('id-ID')+'%0A%0A⚠️ SUDAH UPLOAD BUKTI!%0ACEK MUTASI BRI '+cfg.bri+' / SeaBank '+cfg.seabank+' PAS Rp '+total.toLocaleString('id-ID')+'%0A%0AOrder ID: '+orderId+'%0ABuka Admin: gregarious-web.vercel.app/admin.html';window.open('https://wa.me/'+waToko+'?text='+pesan,'_blank');cart=[];localStorage.setItem('GRGS_CART',JSON.stringify(cart));buktiBase64=null;uniqueCode=Math.floor(Math.random()*900)+100;closeCart();alert('ORDER '+orderId+' TERKIRIM! Rp '+total.toLocaleString('id-ID'));}
async function init(){await cloudLoad();renderProducts();updateCart();setInterval(cloudLoad,5000);}init();
</script></body></html>
