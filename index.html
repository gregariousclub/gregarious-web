<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GREGARIOUS CLUB® - V23 FINAL</title><script src="https://cdn.tailwindcss.com"></script><style>.font-bebas{font-family:Impact,Arial Black,sans-serif;letter-spacing:1px}#drawer{transform:translateX(-100%);transition:0.3s}#drawer.open{transform:translateX(0)}</style></head><body class="bg-black text-white">
<header class="bg-white text-black sticky top-0 z-40 flex justify-between items-center px-4 py-3 border-b-2 border-black"><button onclick="toggleDrawer()" class="w-8 h-8 border-2 border-black rounded-full font-black">☰</button><div id="headerLogo" class="border-2 border-black rounded-[50%] px-5 py-1.5 font-black text-[14px]">GRGS</div><button onclick="openCart()" class="relative font-black text-[20px]">🛒<span id="cartCountHead" class="absolute -top-1 -right-2 bg-black text-white text-[10px] rounded-full px-1.5">0</span></button></header>
<div id="drawer" class="fixed inset-0 z-[100] flex"><div class="bg-white text-black w-[300px] h-full p-6"><div class="flex justify-between"><div id="drawerLogo" class="border-2 border-black rounded-[50%] px-4 py-1 font-black text-[12px]">GRGS</div><button onclick="toggleDrawer()" class="bg-black text-white w-8 h-8 rounded-full">✕</button></div><div class="mt-6 bg-[#f5f5f0] border-2 border-black rounded-[16px] p-4"><p class="text-[10px] font-black">V23 FINAL - ANTI KOSONG!</p><p class="text-[9px] mt-1">10 Produk Hardcode - Pasti Muncul!</p></div></div><div class="flex-1 bg-black/60" onclick="toggleDrawer()"></div></div>
<section class="relative h-[80vh] min-h-[550px] flex items-center justify-center overflow-hidden"><img id="heroImgEl" src="hero.jpg" class="absolute inset-0 w-full h-full object-cover"><div class="absolute inset-0 bg-black/60"></div><div class="relative z-10 text-center px-6 max-w-[420px]"><div id="heroLogoEl" class="mx-auto border-2 border-white rounded-[50%] px-7 py-2.5 font-black text-[18px] w-fit bg-black/30">GRGS</div><p id="brandEl" class="text-[12px] tracking-[0.35em] mt-7 font-bold">GREGARIOUS CLUB</p><h1 class="font-bebas text-[68px] leading-[0.85] mt-6"><span id="heroTitle1El">UNITED</span><br><span id="heroTitle2El">AS ONE</span></h1><button onclick="document.getElementById('shop').scrollIntoView({behavior:'smooth'})" class="mt-8 border-2 border-white rounded-full px-12 py-3.5 text-[13px] font-bold">SHOP NOW</button></div></section>
<section id="shop" class="bg-[#f5f5f0] text-black p-4"><div class="max-w-[1200px] mx-auto"><h2 class="font-black text-[20px]">SHOP COLLECTION - 10 PRODUK PASTI MUNCUL!</h2><p class="text-[11px] opacity-60">V23 FINAL ANTI KOSONG • <span id="apiStatus" class="bg-black text-white px-2 py-1 rounded-full text-[9px]">10 PRODUK READY</span></p><div id="productGrid" class="grid grid-cols-2 md:grid-cols-4 gap-3 mt-5"></div></div></section>
<section class="bg-white text-black p-4 border-t-2 border-black"><h2 class="font-black text-[16px]">ULASAN ★4.9/5 • 558+</h2><div id="ulasanList" class="grid md:grid-cols-3 gap-3 mt-4"></div></section>
<div id="productModal" class="fixed inset-0 bg-black/90 hidden z-50 p-3 flex items-center justify-center"><div class="bg-white text-black rounded-[24px] max-w-[500px] w-full p-5 max-h-[90vh] overflow-auto border-2 border-black"><div class="flex justify-between"><h3 id="modalName" class="font-black text-[13px]"></h3><button onclick="closeModal()" class="bg-black text-white w-8 h-8 rounded-full">✕</button></div><img id="modalImg" class="w-full h-[320px] object-cover rounded-[16px] mt-3 border-2 border-black"><div id="modalThumbs" class="flex gap-2 mt-2 flex-wrap"></div><p id="modalPrice" class="font-black text-[20px] mt-3"></p><p class="text-[11px]">SISA <span id="modalSisa" class="font-black"></span> • S M L XL LENGKAP!</p><div class="mt-4"><p class="font-black text-[11px]">SIZE:</p><div id="sizeBtns" class="grid grid-cols-4 gap-2 mt-2"></div></div><button onclick="addToCart()" class="w-full bg-black text-white py-3.5 rounded-full font-black mt-5">+ KERANJANG</button></div></div>
<div id="cartModal" class="fixed inset-0 bg-black/95 hidden z-[60] p-3 flex items-center justify-center"><div class="bg-white text-black rounded-[24px] max-w-[420px] w-full p-5 max-h-[95vh] overflow-auto border-2 border-black"><div class="flex justify-between"><h3 class="font-black">KERANJANG</h3><button onclick="closeCart()" class="bg-black text-white w-8 h-8 rounded-full">✕</button></div><div id="cartItems" class="mt-3 space-y-2"></div><input id="custName" placeholder="Nama lengkap" class="w-full border-2 border-black rounded-full px-4 py-2.5 mt-4 text-[12px] font-bold"><input id="custWA" placeholder="WA 08xxx" class="w-full border-2 border-black rounded-full px-4 py-2.5 mt-2 text-[12px]"><select id="custOngkir" class="w-full border-2 border-black rounded-full px-4 py-2.5 mt-2 text-[12px] bg-white font-bold"></select><div class="mt-3 bg-black text-white p-3 rounded-[16px]"><input type="file" id="buktiFile" accept="image/*" class="w-full text-[11px]"><div id="previewBukti" class="hidden mt-2"><img id="imgPreview" class="w-full h-[120px] object-cover rounded-[12px]"></div></div><p id="checkoutTotal" class="font-black text-center mt-3 bg-black text-white py-2.5 rounded-full"></p><button onclick="secureCheckout()" class="w-full bg-[#FFD700] border-2 border-black py-3.5 rounded-full font-black mt-3">CHECKOUT WA</button></div></div>
<script>
let DEFAULTS=[{id:"CROSS_BLACK",n:"CROSS TSHIRT - BLACK",p:145000,i:["cross_black.jpg"],s:{S:2,M:3,L:2,XL:1},sold:120,r:4.9},{id:"CROSS_WHITE",n:"CROSS TSHIRT - WHITE",p:145000,i:["cross_white.jpg"],s:{S:2,M:3,L:2,XL:1},sold:98,r:4.8},{id:"BABY_BLACK",n:"BABYTEE - BLACK",p:135000,i:["babytee_black.jpg"],s:{S:5,M:5,L:5,XL:2},sold:75,r:4.9},{id:"BABY_WHITE",n:"BABYTEE - WHITE",p:135000,i:["babytee_white.jpg"],s:{S:5,M:5,L:5,XL:2},sold:68,r:4.9},{id:"RICH_WP_NEW",n:"RICH BEFORE - WHITE PINK (NEW)",p:155000,i:["richbefore_wp_front.jpg","richbefore_wp_back.jpg"],s:{S:5,M:5,L:5,XL:5},sold:12,r:5.0},{id:"RICH_WG",n:"RICH BEFORE - WHITE GREY",p:155000,i:["richbefore_wg_front.jpg"],s:{S:0,M:0,L:0,XL:0},sold:50,r:4.9},{id:"RICH_BG",n:"RICH BEFORE - BLACK GREY",p:155000,i:["richbefore_bg_front.jpg"],s:{S:2,M:3,L:2,XL:1},sold:45,r:4.8},{id:"RICH_BP",n:"RICH BEFORE - BLACK PINK",p:155000,i:["richbefore_bp_front.jpg"],s:{S:0,M:0,L:0,XL:0},sold:50,r:4.9},{id:"RICH_WP_OLD",n:"RICH BEFORE - WHITE PINK",p:155000,i:["richbefore_wp_front.jpg"],s:{S:0,M:0,L:0,XL:0},sold:50,r:4.9},{id:"FL_WHITE",n:"FUCKLOVE - WHITE",p:145000,i:["fucklove_white_front.jpg"],s:{S:3,M:3,L:3,XL:2},sold:40,r:4.9}];
let DEF_CFG={headerLogo:"GRGS",heroLogo:"GRGS",brand:"GREGARIOUS CLUB",heroTitle1:"UNITED",heroTitle2:"AS ONE",wa:"0881023595180"};
let products=JSON.parse(JSON.stringify(DEFAULTS));
try{let p=localStorage.getItem('GRGS_P');if(p){let parsed=JSON.parse(p);if(Array.isArray(parsed)&&parsed.length>0)products=parsed;}}catch(e){}
let cfg=DEF_CFG;try{let c=localStorage.getItem('GRGS_CFG');if(c)cfg={...DEF_CFG,...JSON.parse(c)};}catch(e){}
let ongkir=[{n:"BANDUNG - JNE OKE",p:10000},{n:"JABODETABEK - JNE REG",p:13000}];try{let o=localStorage.getItem('GRGS_ONGKIR');if(o)ongkir=JSON.parse(o);}catch(e){}
let ulasanData=[{name:"Andi • Bandung",text:"Kualitas mantep!",star:5}];try{let u=localStorage.getItem('GRGS_ULASAN');if(u)ulasanData=JSON.parse(u);}catch(e){}
let cart=JSON.parse(localStorage.getItem('GRGS_CART')||'[]');let sel=null,selSize=null,buktiBase64=null;
function normWA(num){let d=(num||'').toString().replace(/[^0-9]/g,'');if(d.startsWith('0'))return'62'+d.slice(1);if(d.startsWith('62'))return d;if(d.startsWith('8'))return'62'+d;return d;}
function toggleDrawer(){document.getElementById('drawer').classList.toggle('open');}
function renderProducts(){let g=document.getElementById('productGrid');if(!g)return;g.innerHTML='';products.forEach((p,i)=>{let tot=Object.values(p.s).reduce((a,b)=>a+b,0);let badge=tot===0?`HABIS`:`SISA ${tot} • TERJUAL ${p.sold}`;let bg=tot===0?'bg-red-600':'bg-black';g.innerHTML+=`<div class="bg-white rounded-[16px] border-2 border-black p-2 cursor-pointer" onclick="openP(${i})"><div class="rounded-[12px] overflow-hidden h-[220px] bg-[#eee] relative border"><img src="${p.i[0]}" onerror="this.src='https://via.placeholder.com/300'" class="w-full h-full object-cover"><div class="absolute top-2 left-2 ${bg} text-white px-2.5 py-1 rounded-full text-[8px] font-black">${badge}</div></div><h3 class="font-black text-[10px] mt-2 text-black">${p.n}</h3><p class="font-black text-[12px] text-black">Rp ${p.p.toLocaleString('id-ID')}</p><p class="text-[9px] text-black">S:${p.s.S} M:${p.s.M} L:${p.s.L} XL:${p.s.XL}</p></div>`;});}
function renderUlasan(){let el=document.getElementById('ulasanList');if(!el)return;el.innerHTML='';ulasanData.forEach(u=>{el.innerHTML+=`<div class="bg-[#f5f5f0] border-2 border-black rounded-[16px] p-4"><p class="font-black text-[11px] text-black">${u.name} ★${u.star}</p><p class="text-[11px] mt-1 text-black">"${u.text}"</p></div>`;});}
function openP(i){sel=products[i];document.getElementById('modalName').innerText=sel.n;document.getElementById('modalPrice').innerText='Rp '+sel.p.toLocaleString('id-ID');document.getElementById('modalSisa').innerText=Object.values(sel.s).reduce((a,b)=>a+b,0);document.getElementById('modalImg').src=sel.i[0];let th=document.getElementById('modalThumbs');th.innerHTML='';sel.i.forEach(im=>{th.innerHTML+=`<div class="w-[52px] h-[52px] rounded-[10px] overflow-hidden border-2 border-black cursor-pointer" onclick="modalImg.src='${im}'"><img src="${im}" class="w-full h-full object-cover"></div>`;});let sb=document.getElementById('sizeBtns');sb.innerHTML='';Object.entries(sel.s).forEach(([sz,q])=>{if(q>0)sb.innerHTML+=`<button id="size_${sz}" onclick="selectSize('${sz}')" class="border-2 border-black rounded-full py-2.5 text-[11px] font-black bg-white text-black">${sz} (${q})</button>`;else sb.innerHTML+=`<button disabled class="border rounded-full py-2.5 text-[11px] opacity-30">${sz} HABIS</button>`;});document.getElementById('productModal').classList.remove('hidden');}
function selectSize(sz){selSize=sz;document.querySelectorAll('#sizeBtns button').forEach(b=>{if(b.id&&b.id.startsWith('size_'))b.className='border-2 border-black rounded-full py-2.5 text-[11px] font-black bg-white text-black';});let a=document.getElementById('size_'+sz);if(a)a.className='bg-black text-white border-2 border-black rounded-full py-2.5 text-[11px] font-black';}
function closeModal(){document.getElementById('productModal').classList.add('hidden');}
function addToCart(){if(!selSize)return alert('Pilih size!');cart.push({n:sel.n,s:selSize,p:sel.p});localStorage.setItem('GRGS_CART',JSON.stringify(cart));updateCart();closeModal();}
function updateCart(){document.getElementById('cartCountHead').innerText=cart.length;let el=document.getElementById('cartItems');el.innerHTML='';let tot=0;cart.forEach((c,i)=>{tot+=c.p;el.innerHTML+=`<div class="flex justify-between border-2 border-black rounded-full px-3 py-2 text-[11px] bg-[#f5f5f0]"><span class="font-bold">${c.n} ${c.s}</span><button onclick="cart.splice(${i},1);localStorage.setItem('GRGS_CART',JSON.stringify(cart));updateCart()" class="text-red-500">✕</button></div>`;});let selO=document.getElementById('custOngkir');selO.innerHTML='';ongkir.forEach(o=>{selO.innerHTML+=`<option value="${o.p}">${o.n} - Rp ${o.p.toLocaleString('id-ID')}</option>`;});let ong=parseInt(selO.value)||10000;document.getElementById('checkoutTotal').innerText='TOTAL: Rp '+(tot+ong).toLocaleString('id-ID');}
function openCart(){updateCart();document.getElementById('cartModal').classList.remove('hidden');}
function closeCart(){document.getElementById('cartModal').classList.add('hidden');}
document.getElementById('buktiFile')?.addEventListener('change',e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=ev=>{buktiBase64=ev.target.result;document.getElementById('previewBukti').classList.remove('hidden');document.getElementById('imgPreview').src=buktiBase64;};r.readAsDataURL(f);});
function secureCheckout(){let nm=custName.value.trim(),wa=custWA.value.trim();if(!nm||!wa)return alert('Isi nama & WA!');if(!buktiBase64)return alert('Upload bukti!');let totProd=cart.reduce((a,b)=>a+b.p,0);let total=totProd+parseInt(custOngkir.value||10000);let waToko=normWA(cfg.wa);window.open(`https://wa.me/${waToko}?text=ORDER%20Rp%20${total.toLocaleString('id-ID')}%20${cart.map(c=>c.n+' '+c.s).join(', ')}%20Nama:${nm}`,'_blank');cart=[];localStorage.setItem('GRGS_CART',JSON.stringify(cart));closeCart();}
document.getElementById('headerLogo').innerText=cfg.headerLogo;document.getElementById('drawerLogo').innerText=cfg.headerLogo;document.getElementById('heroLogoEl').innerText=cfg.heroLogo;document.getElementById('brandEl').innerText=cfg.brand;document.getElementById('heroTitle1El').innerText=cfg.heroTitle1;document.getElementById('heroTitle2El').innerText=cfg.heroTitle2;
renderProducts();renderUlasan();updateCart();
document.getElementById('apiStatus').innerText='✅ V23 FINAL - '+products.length+' PRODUK - ANTI KOSONG!';
</script></body></html>
